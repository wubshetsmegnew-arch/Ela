 if(mode==='win')cls=inW?'win':n===0?'fr':S.win.called.includes(n)?'yl':'';
 else cls=n===0?'fr':set.has(n)?'mk':cl?'cl':'';
 h+=`<div class="c ${cls}" data-a="cell" data-i="${id}" data-n="${n}">${n||'*'}</div>`}
 return `<div class="cg">${hdr()}${h}</div>`}

function syncPayModal(){
  const m=S.payBox;
  let ov=document.getElementById('pay_ov');
  if(!m){
    if(ov)ov.remove();
    return;
  }
  if(!ov){
    ov=document.createElement('div');
    ov.id='pay_ov';
    ov.className='ov';
    const box=document.createElement('div');
    box.id='pay_box';
    box.className='modal hp';
    box.innerHTML=payModalInnerHtml(m);
    ov.appendChild(box);
    document.body.appendChild(ov);
    return;
  }
  const fb=document.getElementById('pay_fb');
  if(fb){
    fb.innerHTML=(m.err?`<div class="msg-err">${m.err}</div>`:'')+(m.ok?`<div class="msg-ok">${m.ok}</div>`:'');
  }
}

document.addEventListener('click',e=>{
 const cancelBtn=e.target.closest('#pay_cancel');
 if(cancelBtn){
  S.payBox=null;syncPayModal();return;
 }
 const sendBtn=e.target.closest('#pay_send');
 if(sendBtn){
  const t=sendBtn.dataset.t;
  const amt=+($('#pay_amt')&&$('#pay_amt').value);
  const minD=+(S.payCfg&&S.payCfg.minDeposit||20);
  const minW=+(S.payCfg&&S.payCfg.minWithdraw||50);
  if(!amt||amt<=0){S.payBox.err='እባክዎ ትክክለኛ የብር መጠን ያስገቡ።';S.payBox.ok='';syncPayModal();return}
  if(t==='deposit'){
   const tx=($('#pay_tx')&&$('#pay_tx').value||'').trim();
   const fileInput=$('#pay_pic');
   const file=fileInput&&fileInput.files&&fileInput.files[0];
   if(amt<minD){S.payBox.err='ዝቅተኛው የDeposit መጠን '+minD+' ብር ነው።';S.payBox.ok='';syncPayModal();return}
   if(tx.length<3){S.payBox.err='እባክዎ Transaction No ያስገቡ።';S.payBox.ok='';syncPayModal();return}
   if(!file){S.payBox.err='እባክዎ የክፍያ Screenshot (ፎቶ) ይምረጡ።';S.payBox.ok='';syncPayModal();return}
   const sendDeposit=(photoData)=>{
    addTx('Deposit req ('+tx+')',amt);
    emit('wallet:deposit_req',{amount:amt,txNumber:tx,photoData:photoData||'',user:ME});
    S.payBox=null;S.wtab='his';S.tab='wallet';render(1);showBanner('✅ የDeposit ጥያቄ ተልኳል');
   };
   if(file){
    if(file.size>4*1024*1024){S.payBox.err='የፎቶ መጠን ከ4MB አይብለጥ።';S.payBox.ok='';syncPayModal();return}
    const reader=new FileReader();
    reader.onload=()=>sendDeposit(reader.result||'');
    reader.onerror=()=>sendDeposit('');
    reader.readAsDataURL(file);
   }else{
    sendDeposit('');
   }
   return;

/* ================= LIVE LAYER: Socket.io + Telegram Mini App ================= */
const SERVER_URL=new URLSearchParams(location.search).get('server')||'https://ela-jbix.onrender.com';
const EV={

const roomKey=()=>S.room?S.room.s+'-'+S.room.n:null;

function liveJoin(r){emit(EV.join,{room:r.s+'-'+r.n,stake:r.s,user:ME});fetchLiveWallet()}
function liveLeave(){if(S.phase==='lobby'||S.left){emit(EV.leave,{room:roomKey()});S.mine=[];S.paid={};S.room=null;S.lowNeed=0;fetchLiveWallet()}else S.left=true}
function livePick(i){
  const rk=roomKey();
  if(S.mine.includes(i)){
    S.mine=S.mine.filter(x=>x!==i);delete S.booked[i];delete S.paid[i];S.lowNeed=0;

  }else if(!S.booked[i]&&S.mine.length<2){
    if(tot()<S.stake){S.lowNeed=S.stake;render(1);return}

    emit(EV.pick,{room:rk,board:i,user:ME});
  }
}
function toCols(rows){const c=[0,1,2,3,4].map(k=>[0,1,2,3,4].map(r=>{const v=rows[r][k];return(v==null||v===0||v==='*'||String(v).toUpperCase()==='FREE')?0:+v}));c[2][2]=0;return c}
function setCards(m){if(!m)return;for(const k in m){try{S.cards[k]=toCols(m[k])}catch(e){}}}
function liveBingo(id){
  if(S.phase!=='play'||S.claimed[id]||!S.marks[id])return;
  const cs=new Set(S.called),p=winLine(card(id),S.marks[id],cs);
  if(!p)return;
  S.claimed[id]=1;
  emit(EV.claim,{room:roomKey(),board:id,user:ME});
  showWin({winners:[{board:id,name:ME.name,userId:ME.id,pattern:p.t,line:p.c}],pool:S.pool,prize:S.pool,called:[...S.called]},true);
}
function playersCount(){const boards=Object.keys(S.booked||{}).length,srv=+S.players;return Math.max(boards,Number.isInteger(srv)&&srv>0?srv:0,S.mine.length)}
function mapServerHistory(h){
  if(!h)return null;
  const ts=h.time?new Date(h.time).getTime():Date.now();
  const amt=Number(h.amount||0);
  if(h.type==='welcome_bonus')return{l:'Welcome Bonus (One-time)',a:amt,ts};
  if(h.type==='deposit_request')return{l:'Deposit req ('+(h.txNumber||'')+')',a:amt,ts};
  if(h.type==='deposit_approved')return{l:'Deposit approved'+(h.txNumber?' ('+h.txNumber+')':''),a:amt,ts};
  if(h.type==='deposit_rejected')return{l:'Deposit rejected',a:0,ts};
  if(h.type==='withdraw_request')return{l:'Withdraw req ('+(h.accountInfo||'')+')',a:-Math.abs(amt),ts};
  if(h.type==='withdraw_approved')return{l:'Withdraw approved',a:-Math.abs(amt),ts};
  if(h.type==='withdraw_rejected')return{l:'Withdraw refunded',a:Math.abs(amt),ts};
  if(h.type==='win')return{l:'Game prize ('+(h.gameCode||'')+' · Board #'+(h.board||'')+')',a:amt,ts};
  if(h.type==='admin_add')return{l:'Admin Main adjust',a:amt,ts};
  if(h.type==='admin_bonus')return{l:'Admin Bonus',a:amt,ts};
  return{l:h.note||h.type||'Activity',a:amt,ts};
}
function applyWallet(w,opts){
  if(!w)return;
  const fromRoomState=!!(opts&&opts.fromRoomState);
  const hasExplicitBal=(w.main!=null||w.bonus!=null);
  if(!hasExplicitBal&&!w.settings&&!Array.isArray(w.history))return;
  if(fromRoomState&&!hasExplicitBal)return;
  if(w.main!=null)S.wallet=Number(w.main)||0;
  if(w.bonus!=null)S.bonus=Number(w.bonus)||0;
  if(w.dep!=null)S.dep=Number(w.dep)||0;
  if(w.withd!=null)S.withd=Number(w.withd)||0;
  if(w.winsCount!=null)S.won=Number(w.winsCount)||0;
  if(w.totalWon!=null)S.totalWon=Number(w.totalWon)||0;
  if(w.bonusClaimed!=null)S.bonusClaimed=Boolean(w.bonusClaimed);
  if(w.settings)S.payCfg=Object.assign({},S.payCfg,w.settings);
  if(Array.isArray(w.history)){
    const mapped=w.history.map(mapServerHistory).filter(Boolean);
    if(mapped.length)S.tx=mapped;
    const winHist=w.history.filter(h=>h.type==='win').map(h=>({
      gid:h.gameCode||'WIN',
      ts:h.time?new Date(h.time).getTime():Date.now(),
      stake:S.stake,
      prize:Number(h.amount||0),
      win:true,
      my:h.board?[+h.board]:[],
      wb:h.board?[+h.board]:[],
      wc:1
    }));
    if(winHist.length&&!S.hist.length)S.hist=winHist;
  }
  LAST_WALLET_TS=Date.now();
}
function fetchLiveWallet(){
  if(!ME.id||!SERVER_URL)return;
  fetch(SERVER_URL.replace(/\/$/,'')+'/api/wallet/'+encodeURIComponent(String(ME.id))+'?t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(data=>{
      if(data&&data.ok&&data.wallet){
        LIVE=true;
        applyWallet(data.wallet);
        render(1);
      }
    })
    .catch(()=>{});
}
function initMarks(){S.mine.forEach(id=>{if(!S.marks[id])S.marks[id]=new Set([0]);if(S.auto)S.called.forEach(n=>S.marks[id].add(n))})}
function endHold(){S.holdUntil=0;const q=S.queued;S.queued=null;if(q){applyState(q);if(S.phase==='play'){S.claimed={};S.played=[...S.mine]}}else{S.phase='lobby';S.win=null;S.marks={};S.called=[];S.claimed={};S.played=null;S.mine=[];S.paid={};S.left=false}render(1)}
function applyState(d){
  const prev=S.phase;d=Object.assign({},d);
  if(S.holdUntil&&Date.now()<S.holdUntil){
    if(d.wallet&&(!d.wallet.userId||String(d.wallet.userId)===String(ME.id)))applyWallet(d.wallet,{fromRoomState:true});
    if(d.cards)setCards(d.cards);
    if(d.phase!=='win')S.queued=Object.assign(S.queued||{},d);
    return;
  }
  if(d.phase==='win')delete d.phase;
  if(prev==='play'&&d.phase&&d.phase!=='play'&&S.called.length<75){
    if(d.wallet&&(!d.wallet.userId||String(d.wallet.userId)===String(ME.id)))applyWallet(d.wallet,{fromRoomState:true});
    if(d.cards)setCards(d.cards);return;
  }
  if(prev==='play')delete d.t;
  if(d.phase)S.phase=d.phase;if(d.t!=null)S.t=d.t;if(d.stake)S.stake=d.stake;
  if(d.booked)S.booked=d.booked;if(d.mine)S.mine=d.mine.map(Number);if(d.paid)S.paid=d.paid;
  if(d.called&&!(prev==='play'&&d.called.length<S.called.length))S.called=d.called;if(d.gid!=null)S.gid=d.gid;if(d.gcode!==undefined||d.gid!=null)S.gcode=d.gcode||'';
  if(d.pool!=null)S.pool=d.pool;if(d.players!=null)S.players=d.players;
  if(d.wallet&&(!d.wallet.userId||String(d.wallet.userId)===String(ME.id)))applyWallet(d.wallet,{fromRoomState:true});
  if(d.cards)setCards(d.cards);
  S.mine.forEach(id=>{if(S.paid[id]==null)S.paid[id]=1});
  if(S.phase==='lobby'){S.marks={};S.win=null;S.left=false;S.called=[];S.claimed={};if(prev!=='lobby'){S.played=null;S.holdUntil=0;if(d.mine===undefined){S.mine=[];S.paid={}}}}else if(S.phase==='play')initMarks()
}
function showWin(d,local){
  if(!d||!Array.isArray(d.winners)||!d.winners.length)return;
  const holding=S.holdUntil&&Date.now()<S.holdUntil&&S.phase==='win';
  if(holding&&!(S.win&&S.win.local&&!local))return;
  setCards(d.cards);d.winners.forEach(x=>{if(x&&(x.rows||x.card))setCards({[x.board]:x.rows||x.card})});
  const called=Array.isArray(d.called)&&d.called.length?d.called:[...S.called],cs=new Set(called);
  const okCell=c=>Array.isArray(c)&&c.length===2&&c.every(v=>Number.isInteger(v)&&v>=0&&v<=4),okLine=l=>Array.isArray(l)&&(l.length===4||l.length===5)&&l.every(okCell);
  const w=[];d.winners.forEach(x=>{const b=x?+x.board:NaN;if(!Number.isInteger(b)||b<1||b>600)return;
    let ln=okLine(x.line)?x.line:null,pt=PNAME[x.pattern]?x.pattern:null;
    if(!ln||!pt){const p=winLine(card(b),cs,cs);if(p){ln=ln||p.c;pt=pt||p.t}}
    w.push({...x,board:b,line:ln||[],pattern:pt})});
  if(!w.length)return;
  const mh=w.filter(isMine),h=mh[0]||w[0],pool=d.pool!=null?d.pool:S.pool,prize=(d.prize!=null&&isFinite(+d.prize))?+d.prize:Math.floor(pool/w.length);
  const win={id:h.board,name:mh.length?ME.name+' (You)':h.name,ln:h.line,pt:h.pattern,mine:mh.length>0,called,wc:w.length,pool,prize,local:!!local,counted:holding?S.win.counted:0,co:w.map(x=>({id:x.board,name:isMine(x)?'You':x.name}))};
  const ent=S.hist.find(x=>x.gid===S.gcode);
  if(holding){S.win=win;if(ent){ent.prize=prize;ent.win=mh.length>0;ent.wb=w.map(x=>x.board);ent.wc=w.length}}
  else{S.phase='win';S.t=8;S.holdUntil=Date.now()+8000;S.queued=null;S.called=called;S.win=win;
    const my=S.played!=null?S.played:S.mine;if(my.length&&!ent)S.hist.unshift({gid:S.gcode,ts:Date.now(),stake:S.stake,prize,win:mh.length>0,my:[...my],wb:w.map(x=>x.board),wc:w.length})}
  if(mh.length&&!win.counted){S.won++;S.totalWon=Number((S.totalWon+prize*mh.length).toFixed(2));win.counted=1;addTx('Game win ('+(S.gcode||'')+')',prize*mh.length)}
  if(d.wallet&&(!d.wallet.userId||String(d.wallet.userId)===String(ME.id)))applyWallet(d.wallet);
  render(1)
}
function liveInit(){
  fetchLiveWallet();
  setInterval(()=>{if(LIVE)fetchLiveWallet()},6000);
  if(!window.io||SERVER_URL.includes('PASTE'))return;
  socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{userId:ME.id,name:ME.name,initData:ME.initData}});

  const onWalletMsg=w=>{if(!w||!w.userId||String(w.userId)===String(ME.id)){applyWallet(w);render(1)}};
  socket.on(EV.wallet,onWalletMsg);

  socket.on(EV.win,d=>showWin(d,false));
}
