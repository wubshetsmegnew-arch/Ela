<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zina Bingo Studio — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090D16;--sl:#121A2B;--sl2:#1B263D;--sl3:#253352;
  --tx:#FFFFFF;--mu:#8D9AB8;--gr:#22E58B;--ye:#FACC15;
  --rd:#EF4444;--bl:#3B82F6;--pu:#8B5CF6;--or:#F97316;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans','Noto Sans Ethiopic',sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;border-radius:10px;font-weight:700}
input,select,textarea{background:var(--bg);border:1px solid var(--sl3);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--bl)}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--sl);padding:12px 14px;border-radius:16px;border:1px solid var(--sl2)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:800}
.brand small{color:var(--mu);font-size:12px;display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--sl2);padding:9px 13px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.bl{background:var(--bl);color:#fff}
.btn.gr{background:#0E9F63;color:#fff}
.btn.rd{background:#B91C1C;color:#fff}
.btn.ye{background:var(--ye);color:#111}
.btn.pu{background:var(--pu);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:thin}
.tab{background:var(--sl);color:var(--mu);padding:9px 13px;font-size:12px;white-space:nowrap;border:1px solid var(--sl2)}
.tab.act{background:var(--bl);color:#fff;border-color:var(--bl)}
.card{background:var(--sl);border:1px solid var(--sl2);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 10px;font-size:16px;font-weight:800}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.kpi{background:var(--sl2);border:1px solid var(--sl3);border-radius:14px;padding:12px}
.kpi small{color:var(--mu);font-size:11px;display:block}
.kpi b{font-size:20px;font-weight:800;display:block;margin-top:4px}
.ok{color:var(--gr)}.warn{color:var(--ye)}.bad{color:#F87171}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--sl2)}
th{color:var(--mu);font-size:11px;text-transform:uppercase}
.tbl-wrap{overflow-x:auto}
.pill{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.pill.ok{background:#0E9F6333;color:var(--gr)}
.pill.warn{background:#FACC1528;color:var(--ye)}
.pill.bad{background:#EF444433;color:#FCA5A5}
.row-gap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.toast{position:fixed;bottom:16px;right:16px;background:#0E9F63;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:800;z-index:99;box-shadow:0 8px 24px #0009}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DB_KEY = 'zina_bingo_studio_v1';
const defaultState = () => ({
  section: 'dashboard',
  serverUrl: 'https://ela-jbix.onrender.com',
  botOnline: true,
  serverOnline: true,
  game: {
    phase: 'LOBBY',
    countdown: 24,
    code: 'R1042_ZINA',
    boards: 18,
    pool: 144,
    entryFee: 10,
    cardPrice: 10,
    minPlayers: 2,
    maxPlayers: 600,
    maxCards: 2,
    winnersCount: 1,
    prizePct: 80,
    callIntervalSec: 4,
    autoStart: true,
    autoCall: true,
    patterns: ['horizontal', 'vertical', 'diagonal', 'corners'],
    rules: '1-75 ball Bingo. Horizontal, vertical, diagonal, or 4 corners win. Equal split on ties.'
  },
  players: [
    { id: '7379955498', username: '@wubshet_admin', name: 'Wubshet Admin', balance: 2500, bonus: 100, status: 'active', games: 14, deposited: 3000, withdrawn: 600 },
    { id: '100200301', username: '@abebe_b', name: 'Abebe Bikila', balance: 420, bonus: 0, status: 'active', games: 9, deposited: 600, withdrawn: 180 },
    { id: '100200302', username: '@tigist_t', name: 'Tigist Tadesse', balance: 150, bonus: 20, status: 'frozen', games: 5, deposited: 200, withdrawn: 0 },
    { id: '100200303', username: '@dawit_k', name: 'Dawit Kebede', balance: 0, bonus: 0, status: 'banned', games: 2, deposited: 50, withdrawn: 0 }
  ],
  deposits: [
    { id: 'DEP-901', playerId: '100200301', player: '@abebe_b', amount: 500, method: 'Telebirr', ref: 'TB88492011', status: 'pending', ts: Date.now()-3600000 },
    { id: 'DEP-900', playerId: '7379955498', player: '@wubshet_admin', amount: 1000, method: 'CBE Birr', ref: 'FT263309182', status: 'approved', ts: Date.now()-86400000 }
  ],
  withdrawals: [
    { id: 'WDR-501', playerId: '100200301', player: '@abebe_b', amount: 180, method: 'Telebirr', dest: '0911223344', status: 'pending', ts: Date.now()-1800000 },
    { id: 'WDR-500', playerId: '7379955498', player: '@wubshet_admin', amount: 600, method: 'CBE Birr', dest: '1000456789123', status: 'paid', ts: Date.now()-72000000 }
  ],
  winners: [
    { id: 'WIN-301', gameCode: 'R1041_ZINA', player: '@abebe_b', board: 44, pattern: 'Diagonal Line', prize: 320, paid: true, ts: Date.now()-5400000 }
  ],
  transactions: [
    { id: 'TX-1', player: '@wubshet_admin', type: 'deposit', amount: 1000, reason: 'Verified CBE deposit', ts: Date.now()-86400000 },
    { id: 'TX-2', player: '@abebe_b', type: 'prize', amount: 320, reason: 'Game R1041_ZINA win', ts: Date.now()-5400000 }
  ],
  tickets: [
    { id: 'TKT-12', player: '@tigist_t', category: 'Payment', message: 'My deposit receipt was uploaded 15 mins ago.', status: 'open', reply: '' }
  ],
  staff: [
    { id: '7379955498', name: 'Wubshet Admin', role: 'Super Admin', active: true },
    { id: '200100991', name: 'Finance Officer', role: 'Finance Admin', active: true },
    { id: '200100992', name: 'Game Moderator', role: 'Game Manager', active: true }
  ],
  logs: [
    { ts: Date.now()-7200000, actor: 'Super Admin', action: 'LOGIN', detail: 'Authenticated to Zina Bingo Studio' },
    { ts: Date.now()-5400000, actor: 'Game Manager', action: 'PRIZE_PAID', detail: 'Approved 320 Br prize for Board #44' }
  ],
  backups: [
    { id: 'BKP-20261126-01', ts: Date.now()-14400000, size: '4.8 MB', note: 'Pre-migration snapshot (all accounts & balances safe)' }
  ],
  metrics: {
    totalPlayers: 1240,
    activePlayers: 86,
    newPlayersToday: 29,
    totalGames: 418,
    runningGames: 2,
    completedGames: 416,
    depositsToday: 14850,
    withdrawalsToday: 6200,
    totalRevenue: 98400,
    totalExpenses: 14200,
    prizesPaid: 61500,
    pendingPayments: 2,
    cpu: '14%',
    ram: '218 MB / 512 MB',
    disk: '1.2 GB / 10 GB',
    dbStatus: 'Connected',
    uptime: '18d 06h 42m'
  }
});

let A = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  }catch(e){ return defaultState(); }
}
function save(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(A)); }catch(e){}
}
function logAction(action, detail){
  A.logs.unshift({ ts: Date.now(), actor: 'Admin', action, detail });
  if(A.logs.length > 100) A.logs.pop();
  save();
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
const fmt = n => 'Br ' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt = ts => new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

const SECTIONS = [
  ['dashboard','📊 Dashboard'],
  ['players','👥 Players'],
  ['games','🎮 Games'],
  ['wallet','💰 Wallet'],
  ['deposits','📥 Deposits'],
  ['withdrawals','📤 Withdrawals'],
  ['winners','🏆 Winners'],
  ['settings','⚙ Settings'],
  ['broadcast','📢 Broadcast'],
  ['reports','📈 Reports'],
  ['support','🎧 Support'],
  ['staff','🛡 Staff & Roles'],
  ['security','🔐 Security & Logs'],
  ['server','🖥 Server & Bot'],
  ['db','🗄 DB & Migration']
];

function render(){
  const g = A.game, m = A.metrics;
  let body = '';

  if(A.section === 'dashboard'){
    body = `
    <div class="card">
      <h2>📊 Admin Dashboard</h2>
      <div class="grid4">
        <div class="kpi"><small>Total Players</small><b>${m.totalPlayers + A.players.length - 4}</b></div>
        <div class="kpi"><small>Active Players</small><b class="ok">${m.activePlayers}</b></div>
        <div class="kpi"><small>New Players Today</small><b>${m.newPlayersToday}</b></div>
        <div class="kpi"><small>Total Games</small><b>${m.totalGames}</b></div>
        <div class="kpi"><small>Running Games</small><b class="warn">${m.runningGames}</b></div>
        <div class="kpi"><small>Completed Games</small><b>${m.completedGames}</b></div>
        <div class="kpi"><small>Today's Deposits</small><b class="ok">${fmt(m.depositsToday)}</b></div>
        <div class="kpi"><small>Today's Withdrawals</small><b class="bad">${fmt(m.withdrawalsToday)}</b></div>
        <div class="kpi"><small>Total Revenue</small><b class="ok">${fmt(m.totalRevenue)}</b></div>
        <div class="kpi"><small>Total Expenses</small><b>${fmt(m.totalExpenses)}</b></div>
        <div class="kpi"><small>Prizes Paid</small><b class="warn">${fmt(m.prizesPaid)}</b></div>
        <div class="kpi"><small>Pending Payments</small><b class="warn">${A.deposits.filter(d=>d.status==='pending').length + A.withdrawals.filter(w=>w.status==='pending').length}</b></div>
        <div class="kpi"><small>Bot Status</small><b class="${A.botOnline?'ok':'bad'}">${A.botOnline?'ONLINE':'OFFLINE'}</b></div>
        <div class="kpi"><small>Server Status</small><b class="${A.serverOnline?'ok':'bad'}">${A.serverOnline?'HEALTHY':'DOWN'}</b></div>
      </div>
    </div>
    <div class="card">
      <h3>📡 Live Game Telemetry</h3>
      <div class="grid4">
        <div class="kpi"><small>Phase</small><b>${g.phase}</b></div>
        <div class="kpi"><small>Countdown</small><b>${g.countdown}s</b></div>
        <div class="kpi"><small>Game Code</small><b>${g.code}</b></div>
        <div class="kpi"><small>Boards / Pool</small><b>${g.boards} / ${fmt(g.pool)}</b></div>
      </div>
    </div>`;
  }

  else if(A.section === 'players'){
    const q = (A.playerSearch||'').toLowerCase();
    const list = A.players.filter(p => !q || String(p.id).includes(q) || p.username.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
    body = `
    <div class="card">
      <h2>👥 Player Management</h2>
      <div class="row-gap" style="margin-bottom:10px">
        <input id="pSearch" placeholder="Search by Telegram ID, @username, or name..." value="${A.playerSearch||''}" style="max-width:340px">
        <button class="btn bl" onclick="applySearch()">Search</button>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Telegram ID</th><th>Player</th><th>Balance</th><th>Games</th><th>Dep / Wdr</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${list.map(p=>`
              <tr>
                <td><b>${p.id}</b></td>
                <td>${p.name}<br><small style="color:var(--mu)">${p.username}</small></td>
                <td><b>${fmt(p.balance)}</b><br><small style="color:var(--mu)">Bonus: ${fmt(p.bonus)}</small></td>
                <td>${p.games}</td>
                <td>${fmt(p.deposited)} / ${fmt(p.withdrawn)}</td>
                <td><span class="pill ${p.status==='active'?'ok':p.status==='frozen'?'warn':'bad'}">${p.status.toUpperCase()}</span></td>
                <td>
                  <div class="row-gap">
                    <button class="btn gr" onclick="setPlayerStatus('${p.id}','active')">Unban/Active</button>
                    <button class="btn ye" onclick="setPlayerStatus('${p.id}','frozen')">Freeze</button>
                    <button class="btn rd" onclick="setPlayerStatus('${p.id}','banned')">Ban</button>
                    <button class="btn bl" onclick="msgPlayer('${p.username}')">Message</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  else if(A.section === 'games'){
    body = `
    <div class="card">
      <h2>🎮 Game Management</h2>
      <div class="row-gap" style="margin-bottom:12px">
        <button class="btn gr" onclick="gameAction('RUNNING','New game created & started')">▶ Create / Start Game</button>
        <button class="btn ye" onclick="gameAction('PAUSED','Game paused')">⏸ Pause</button>
        <button class="btn bl" onclick="gameAction('RUNNING','Game resumed')">⏯ Resume</button>
        <button class="btn rd" onclick="gameAction('CANCELLED','Game cancelled & stakes refunded')">✖ Cancel Game</button>
        <button class="btn pu" onclick="gameAction('LOBBY','Game restarted into lobby')">↻ Restart Game</button>
      </div>
      <div class="grid3">
        <div class="field"><label>Entry Fee (Br)</label><input type="number" id="gEntry" value="${g.entryFee}"></div>
        <div class="field"><label>Card Price (Br)</label><input type="number" id="gCardPrice" value="${g.cardPrice}"></div>
        <div class="field"><label>Min Players</label><input type="number" id="gMinP" value="${g.minPlayers}"></div>
        <div class="field"><label>Max Players</label><input type="number" id="gMaxP" value="${g.maxPlayers}"></div>
        <div class="field"><label>Auto Start</label><select id="gAutoStart"><option value="1" ${g.autoStart?'selected':''}>Enabled</option><option value="0" ${!g.autoStart?'selected':''}>Disabled</option></select></div>
        <div class="field"><label>Auto Number Calling</label><select id="gAutoCall"><option value="1" ${g.autoCall?'selected':''}>Enabled</option><option value="0" ${!g.autoCall?'selected':''}>Disabled</option></select></div>
      </div>
      <button class="btn bl" onclick="saveGameConfig()">Save Game Settings</button>
    </div>`;
  }

  else if(A.section === 'wallet'){
    body = `
    <div class="card">
      <h2>💰 Wallet Management & Auditable Adjustments</h2>
      <div class="grid3">
        <div class="field"><label>Select Player</label><select id="wPlayer">${A.players.map(p=>`<option value="${p.id}">${p.name} (${p.username}) — ${fmt(p.balance)}</option>`).join('')}</select></div>
        <div class="field"><label>Amount (Br)</label><input type="number" id="wAmt" placeholder="100"></div>
        <div class="field"><label>Audit Reason (Required)</label><input id="wReason" placeholder="e.g. Manual top-up verification or error fix"></div>
      </div>
      <div class="row-gap">
        <button class="btn gr" onclick="adjustWallet(1)">+ Add Money</button>
        <button class="btn rd" onclick="adjustWallet(-1)">− Deduct Money</button>
      </div>
    </div>
    <div class="card">
      <h3>📜 Audit Transaction Ledger (Immutable Log)</h3>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>TX ID</th><th>Player</th><th>Type</th><th>Amount</th><th>Reason</th><th>Time</th></tr></thead>
          <tbody>${A.transactions.map(t=>`<tr><td>${t.id}</td><td>${t.player}</td><td>${t.type}</td><td class="${t.amount>=0?'ok':'bad'}">${t.amount>=0?'+':''}${fmt(t.amount)}</td><td>${t.reason}</td><td>${dt(t.ts)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  else if(A.section === 'deposits'){
    body = `
    <div class="card">
      <h2>📥 Deposit Management</h2>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>ID</th><th>Player</th><th>Amount</th><th>Method & Ref</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${A.deposits.map(d=>`
              <tr>
                <td>${d.id}</td>
                <td>${d.player}</td>
                <td><b>${fmt(d.amount)}</b></td>
                <td>${d.method} · <code>${d.ref}</code></td>
                <td><span class="pill ${d.status==='approved'?'ok':d.status==='pending'?'warn':'bad'}">${d.status.toUpperCase()}</span></td>
                <td>
                  ${d.status==='pending'?`<div class="row-gap"><button class="btn gr" onclick="decideDeposit('${d.id}','approved')">Approve & Credit</button><button class="btn rd" onclick="decideDeposit('${d.id}','rejected')">Reject</button></div>`:'Verified'}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  else if(A.section === 'withdrawals'){
    body = `
    <div class="card">
      <h2>📤 Withdrawal Management</h2>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>ID</th><th>Player</th><th>Amount</th><th>Destination</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${A.withdrawals.map(w=>`
              <tr>
                <td>${w.id}</td>
                <td>${w.player}</td>
                <td><b>${fmt(w.amount)}</b></td>
                <td>${w.method} · ${w.dest}</td>
                <td><span class="pill ${w.status==='paid'?'ok':w.status==='pending'?'warn':'bad'}">${w.status.toUpperCase()}</span></td>
                <td>
                  ${w.status==='pending'?`<div class="row-gap"><button class="btn gr" onclick="decideWithdrawal('${w.id}','paid')">Approve & Mark Paid</button><button class="btn rd" onclick="decideWithdrawal('${w.id}','rejected')">Reject & Refund</button></div>`:'Completed'}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  else if(A.section === 'winners'){
    body = `
    <div class="card">
      <h2>🏆 Winner & Prize Verification</h2>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Win ID</th><th>Game</th><th>Winner</th><th>Board & Pattern</th><th>Prize</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${A.winners.map(w=>`
              <tr>
                <td>${w.id}</td>
                <td>${w.gameCode}</td>
                <td><b>${w.player}</b></td>
                <td>Board #${w.board} · ${w.pattern}</td>
                <td class="ok"><b>${fmt(w.prize)}</b></td>
                <td><span class="pill ${w.paid?'ok':'warn'}">${w.paid?'PAID':'PENDING'}</span></td>
                <td>${!w.paid?`<button class="btn gr" onclick="payPrize('${w.id}')">Approve Prize</button>`:'Verified & Paid'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  else if(A.section === 'settings'){
    body = `
    <div class="card">
      <h2>⚙ Global Game Settings</h2>
      <div class="grid3">
        <div class="field"><label>Default Entry Fee (Br)</label><input type="number" id="sEntry" value="${g.entryFee}"></div>
        <div class="field"><label>Card Price (Br)</label><input type="number" id="sCard" value="${g.cardPrice}"></div>
        <div class="field"><label>Prize Pool (%)</label><input type="number" id="sPct" value="${g.prizePct}"></div>
        <div class="field"><label>Max Cards / Player</label><input type="number" id="sMaxC" value="${g.maxCards}"></div>
        <div class="field"><label>Number Call Interval (sec)</label><input type="number" id="sInt" value="${g.callIntervalSec}"></div>
        <div class="field"><label>Lobby Countdown (sec)</label><input type="number" id="sCd" value="${g.countdown}"></div>
      </div>
      <div class="field"><label>Game Rules</label><textarea id="sRules" rows="2">${g.rules}</textarea></div>
      <button class="btn gr" onclick="saveGlobalSettings()">Save All Settings</button>
    </div>`;
  }

  else if(A.section === 'broadcast'){
    body = `
    <div class="card">
      <h2>📢 Notification & Broadcast Center</h2>
      <div class="grid2">
        <div class="field"><label>Audience</label><select id="bAud"><option value="All Players">All Players</option><option value="Selected Player">Selected Player</option><option value="Winners Only">Winners Only</option></select></div>
        <div class="field"><label>Announcement Type</label><select id="bType"><option>Game Announcement</option><option>Winner Announcement</option><option>Payment Confirmation</option><option>New Game Alert</option></select></div>
      </div>
      <div class="field"><label>Message Content</label><textarea id="bMsg" rows="3" placeholder="Write broadcast message to players..."></textarea></div>
      <button class="btn bl" onclick="sendBroadcast()">Send Broadcast Now</button>
    </div>`;
  }

  else if(A.section === 'reports'){
    const netProfit = m.totalRevenue - m.totalExpenses;
    const playerLiabilities = A.players.reduce((s,p)=>s+(+p.balance||0)+(+p.bonus||0),0);
    body = `
    <div class="card">
      <h2>📈 Financial & Operational Reports</h2>
      <div class="grid4">
        <div class="kpi"><small>Gross Revenue</small><b class="ok">${fmt(m.totalRevenue)}</b></div>
        <div class="kpi"><small>Total Expenses + Prizes</small><b class="bad">${fmt(m.totalExpenses + m.prizesPaid)}</b></div>
        <div class="kpi"><small>Net Business Profit</small><b class="ok">${fmt(netProfit)}</b></div>
        <div class="kpi"><small>Player Wallet Liabilities</small><b class="warn">${fmt(playerLiabilities)}</b></div>
      </div>
      <div class="row-gap" style="margin-top:12px">
        <button class="btn gr" onclick="exportCsv()">⬇ Export CSV Report</button>
      </div>
    </div>`;
  }

  else if(A.section === 'support'){
    body = `
    <div class="card">
      <h2>🎧 Support Tickets</h2>
      ${A.tickets.map(t=>`
        <div class="kpi" style="margin-bottom:8px">
          <div class="row-gap" style="justify-content:space-between">
            <b>${t.id} · ${t.player} (${t.category})</b>
            <span class="pill ${t.status==='open'?'warn':'ok'}">${t.status.toUpperCase()}</span>
          </div>
          <p style="margin:6px 0">${t.message}</p>
          <button class="btn gr" onclick="closeTicket('${t.id}')">Mark Resolved</button>
        </div>`).join('')}
    </div>`;
  }

  else if(A.section === 'staff'){
    body = `
    <div class="card">
      <h2>🛡 Admin & Staff Role Management</h2>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Staff ID</th><th>Name</th><th>Role</th><th>Status</th></tr></thead>
          <tbody>${A.staff.map(s=>`<tr><td>${s.id}</td><td><b>${s.name}</b></td><td><span class="pill ok">${s.role}</span></td><td>${s.active?'Active':'Disabled'}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  else if(A.section === 'security'){
    body = `
    <div class="card">
      <h2>🔐 Security & Activity Logs</h2>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead>
          <tbody>${A.logs.map(l=>`<tr><td>${dt(l.ts)}</td><td>${l.actor}</td><td><span class="pill warn">${l.action}</span></td><td>${l.detail}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  else if(A.section === 'server'){
    body = `
    <div class="card">
      <h2>🖥 Server & Bot Control</h2>
      <div class="grid4" style="margin-bottom:12px">
        <div class="kpi"><small>CPU Usage</small><b>${m.cpu}</b></div>
        <div class="kpi"><small>RAM Usage</small><b>${m.ram}</b></div>
        <div class="kpi"><small>Disk Usage</small><b>${m.disk}</b></div>
        <div class="kpi"><small>Uptime</small><b>${m.uptime}</b></div>
      </div>
      <div class="row-gap">
        <button class="btn gr" onclick="toggleBot(true)">Bot Online</button>
        <button class="btn rd" onclick="toggleBot(false)">Bot Offline</button>
        <button class="btn ye" onclick="restartBot()">↻ Restart Bot Service</button>
      </div>
    </div>`;
  }

  else if(A.section === 'db'){
    body = `
    <div class="card">
      <h2>🗄 Database, Backups & Safe Migration</h2>
      <p style="color:var(--mu);font-size:13px">All player IDs, balances, transactions, and game records are preserved during upgrades or server migrations.</p>
      <div class="row-gap" style="margin-bottom:12px">
        <button class="btn gr" onclick="createBackup()">+ Create Database Backup Now</button>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Backup ID</th><th>Created</th><th>Size</th><th>Notes</th></tr></thead>
          <tbody>${A.backups.map(b=>`<tr><td><b>${b.id}</b></td><td>${dt(b.ts)}</td><td>${b.size}</td><td>${b.note}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="top">
      <div class="brand">
        <span style="font-size:26px">🎬</span>
        <div>
          <h1>Zina Bingo Studio</h1>
          <small>${A.serverUrl} · Full Admin Control</small>
        </div>
      </div>
      <div class="actions">
        <a class="btn bl" href="/" style="text-decoration:none">🎮 Mini App</a>
        <button class="btn gr" onclick="save();toast('Synced & Saved')">↻ Sync</button>
      </div>
    </div>
    <div class="tabs">
      ${SECTIONS.map(([k,label])=>`<button class="tab ${A.section===k?'act':''}" onclick="setSec('${k}')">${label}</button>`).join('')}
    </div>
    ${body}
  `;
}

window.setSec = k => { A.section = k; save(); render(); };
window.applySearch = () => { A.playerSearch = document.getElementById('pSearch').value; render(); };
window.setPlayerStatus = (id, status) => {
  const p = A.players.find(x=>x.id===id);
  if(p){ p.status = status; logAction('PLAYER_STATUS', `${p.username} -> ${status}`); save(); render(); toast(`Player ${status}`); }
};
window.msgPlayer = u => { logAction('DIRECT_MSG', `Sent message to ${u}`); toast(`Message sent to ${u}`); };
window.gameAction = (phase, msg) => {
  A.game.phase = phase;
  if(phase === 'RUNNING') A.game.countdown = 0;
  if(phase === 'LOBBY') A.game.countdown = 30;
  logAction('GAME_CONTROL', msg); save(); render(); toast(msg);
};
window.saveGameConfig = () => {
  A.game.entryFee = +document.getElementById('gEntry').value || 10;
  A.game.cardPrice = +document.getElementById('gCardPrice').value || 10;
  A.game.minPlayers = +document.getElementById('gMinP').value || 2;
  A.game.maxPlayers = +document.getElementById('gMaxP').value || 600;
  A.game.autoStart = document.getElementById('gAutoStart').value === '1';
  A.game.autoCall = document.getElementById('gAutoCall').value === '1';
  logAction('GAME_CONFIG', 'Updated game parameters'); save(); render(); toast('Game settings saved');
};
window.adjustWallet = dir => {
  const pid = document.getElementById('wPlayer').value;
  const amt = Math.abs(+document.getElementById('wAmt').value || 0);
  const reason = (document.getElementById('wReason').value || '').trim();
  if(!amt) return toast('Enter valid amount');
  if(!reason) return toast('Audit reason is required');
  const p = A.players.find(x=>x.id===pid);
  if(!p) return;
  const delta = dir * amt;
  p.balance = Math.max(0, p.balance + delta);
  A.transactions.unshift({ id: 'TX-'+Date.now().toString().slice(-5), player: p.username, type: dir>0?'admin_credit':'admin_debit', amount: delta, reason, ts: Date.now() });
  logAction('WALLET_ADJUST', `${p.username} ${delta>=0?'+':''}${delta} Br (${reason})`);
  save(); render(); toast('Wallet adjustment recorded');
};
window.decideDeposit = (id, status) => {
  const d = A.deposits.find(x=>x.id===id);
  if(!d || d.status!=='pending') return;
  d.status = status;
  if(status === 'approved'){
    const p = A.players.find(x=>x.id===d.playerId);
    if(p){ p.balance += d.amount; p.deposited += d.amount; }
    A.metrics.depositsToday += d.amount;
    A.transactions.unshift({ id: 'TX-'+Date.now().toString().slice(-5), player: d.player, type: 'deposit', amount: d.amount, reason: `Approved ${d.id} (${d.ref})`, ts: Date.now() });
  }
  logAction('DEPOSIT_'+status.toUpperCase(), `${d.id} (${fmt(d.amount)})`);
  save(); render(); toast(`Deposit ${status}`);
};
window.decideWithdrawal = (id, status) => {
  const w = A.withdrawals.find(x=>x.id===id);
  if(!w || w.status!=='pending') return;
  w.status = status;
  if(status === 'paid'){
    const p = A.players.find(x=>x.id===w.playerId);
    if(p){ p.balance = Math.max(0, p.balance - w.amount); p.withdrawn += w.amount; }
    A.metrics.withdrawalsToday += w.amount;
    A.transactions.unshift({ id: 'TX-'+Date.now().toString().slice(-5), player: w.player, type: 'withdrawal', amount: -w.amount, reason: `Paid ${w.id} -> ${w.dest}`, ts: Date.now() });
  }
  logAction('WITHDRAWAL_'+status.toUpperCase(), `${w.id} (${fmt(w.amount)})`);
  save(); render(); toast(`Withdrawal ${status}`);
};
window.payPrize = id => {
  const w = A.winners.find(x=>x.id===id);
  if(!w) return;
  w.paid = true;
  A.metrics.prizesPaid += w.prize;
  logAction('PRIZE_APPROVED', `${w.id} paid ${fmt(w.prize)} to ${w.player}`);
  save(); render(); toast('Prize approved & recorded');
};
window.saveGlobalSettings = () => {
  A.game.entryFee = +document.getElementById('sEntry').value || 10;
  A.game.cardPrice = +document.getElementById('sCard').value || 10;
  A.game.prizePct = +document.getElementById('sPct').value || 80;
  A.game.maxCards = +document.getElementById('sMaxC').value || 2;
  A.game.callIntervalSec = +document.getElementById('sInt').value || 4;
  A.game.countdown = +document.getElementById('sCd').value || 30;
  A.game.rules = document.getElementById('sRules').value;
  logAction('GLOBAL_SETTINGS', 'Saved global Bingo rules & economics');
  save(); render(); toast('Global settings saved');
};
window.sendBroadcast = () => {
  const aud = document.getElementById('bAud').value;
  const type = document.getElementById('bType').value;
  const msg = (document.getElementById('bMsg').value || '').trim();
  if(!msg) return toast('Enter broadcast text');
  logAction('BROADCAST', `[${type} -> ${aud}] ${msg}`);
  save(); toast('Broadcast queued & logged');
};
window.exportCsv = () => {
  const rows = [['Metric','Value'],['Total Revenue',A.metrics.totalRevenue],['Total Expenses',A.metrics.totalExpenses],['Prizes Paid',A.metrics.prizesPaid],['Deposits Today',A.metrics.depositsToday],['Withdrawals Today',A.metrics.withdrawalsToday]];
  const blob = new Blob([rows.map(r=>r.join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zina-bingo-report.csv'; a.click();
  toast('CSV report downloaded');
};
window.closeTicket = id => {
  const t = A.tickets.find(x=>x.id===id);
  if(t){ t.status = 'closed'; logAction('TICKET_CLOSED', id); save(); render(); toast('Ticket closed'); }
};
window.toggleBot = on => { A.botOnline = on; logAction('BOT_STATUS', on?'Bot set ONLINE':'Bot set OFFLINE'); save(); render(); toast(on?'Bot is ONLINE':'Bot is OFFLINE'); };
window.restartBot = () => { logAction('BOT_RESTART', 'Triggered bot service restart'); toast('Bot restart signal sent'); };
window.createBackup = () => {
  const id = 'BKP-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + String(A.backups.length+1).padStart(2,'0');
  A.backups.unshift({ id, ts: Date.now(), size: '5.1 MB', note: 'Manual snapshot — all accounts & balances preserved' });
  logAction('DB_BACKUP', `Created ${id}`); save(); render(); toast('Database backup created');
};

render();
</script>
</body>
</html>
