  res.send(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

.kpi{background:var(--sl2);border:1px solid var(--sl3);border-radius:14px;padding:12px}
.kpi small{color:var(--mu);font-size:11px;display:block}
.kpi b{font-size:20px;font-weight:800;display:block;margin-top:4px}
.ok{color:var(--gr)}.warn{color:var(--ye)}.bad{color:#F87171}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--sl2)}
th{color:var(--mu);font-size:11px;text-transform:uppercase}
.tbl-wrap{overflow-x:auto}
.pill{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.pill.ok{background:#0E9F6333;color:var(--gr)}
.pill.warn{background:#FACC1528;color:var(--ye)}
.pill.bad{background:#EF444433;color:#FCA5A5}
.row-gap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.toast{position:fixed;bottom:16px;right:16px;background:#0E9F63;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:800;z-index:99}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DB_KEY = 'zina_bingo_studio_v1';
const defaultState = () => ({
  section: 'dashboard',
  botOnline: true,
  serverOnline: true,
  game: {
    phase: 'LOBBY', countdown: 25, code: 'R1042_ZINA', boards: 16, pool: 128,
    entryFee: 10, cardPrice: 10, minPlayers: 2, maxPlayers: 600, maxCards: 2,
    winnersCount: 1, prizePct: 80, callIntervalSec: 4, autoStart: true, autoCall: true,
    patterns: ['horizontal','vertical','diagonal','corners'],
    rules: '75-ball Bingo. Horizontal, vertical, diagonal, or 4 corners win.'
  },
  players: [
    { id:'7379955498', username:'@admin_owner', name:'Admin Owner', balance:2500, bonus:100, status:'active', games:14, deposited:3000, withdrawn:600 },
    { id:'100200301', username:'@player_one', name:'Player One', balance:420, bonus:0, status:'active', games:9, deposited:600, withdrawn:180 },
    { id:'100200302', username:'@player_two', name:'Player Two', balance:150, bonus:20, status:'frozen', games:5, deposited:200, withdrawn:0 },
    { id:'100200303', username:'@player_three', name:'Player Three', balance:0, bonus:0, status:'banned', games:2, deposited:50, withdrawn:0 }
  ],
  deposits: [
    { id:'DEP-901', playerId:'100200301', player:'@player_one', amount:500, method:'Telebirr', ref:'TB88492011', status:'pending', ts:Date.now()-3600000 },
    { id:'DEP-900', playerId:'7379955498', player:'@admin_owner', amount:1000, method:'CBE Birr', ref:'FT263309182', status:'approved', ts:Date.now()-86400000 }
  ],
  withdrawals: [
    { id:'WDR-501', playerId:'100200301', player:'@player_one', amount:180, method:'Telebirr', dest:'0911223344', status:'pending', ts:Date.now()-1800000 },
    { id:'WDR-500', playerId:'7379955498', player:'@admin_owner', amount:600, method:'CBE Birr', dest:'1000456789123', status:'paid', ts:Date.now()-72000000 }
  ],
  winners: [
    { id:'WIN-301', gameCode:'R1041_ZINA', player:'@player_one', board:44, pattern:'Diagonal Line', prize:320, paid:true, ts:Date.now()-5400000 }
  ],
  transactions: [
    { id:'TX-1', player:'@admin_owner', type:'deposit', amount:1000, reason:'Verified CBE deposit', ts:Date.now()-86400000 },
    { id:'TX-2', player:'@player_one', type:'prize', amount:320, reason:'Game R1041_ZINA win', ts:Date.now()-5400000 }
  ],
  tickets: [
    { id:'TKT-12', player:'@player_two', category:'Payment', message:'Deposit receipt submitted, awaiting check.', status:'open' }
  ],
  staff: [
    { id:'7379955498', name:'Super Admin', role:'Super Admin', active:true },
    { id:'200100991', name:'Finance Admin', role:'Finance Admin', active:true },
    { id:'200100992', name:'Game Manager', role:'Game Manager', active:true },
    { id:'200100993', name:'Support Admin', role:'Support Admin', active:true },
    { id:'200100994', name:'Report Viewer', role:'Report Viewer', active:true }
  ],
  logs: [
    { ts:Date.now()-7200000, actor:'Super Admin', action:'LOGIN', detail:'Studio session started' },
    { ts:Date.now()-5400000, actor:'Game Manager', action:'PRIZE_PAID', detail:'Verified Board #44 prize' }
  ],
  backups: [
    { id:'BKP-20261126-01', ts:Date.now()-14400000, size:'4.8 MB', note:'Preserved accounts, balances, transactions & game history' }
  ],
  metrics: {
    totalPlayers:1240, activePlayers:86, newPlayersToday:29,
    totalGames:418, runningGames:2, completedGames:416,
    depositsToday:14850, withdrawalsToday:6200,
    totalRevenue:98400, totalExpenses:14200, prizesPaid:61500,
    cpu:'14%', ram:'218 MB / 512 MB', disk:'1.2 GB / 10 GB',
    dbStatus:'Connected', uptime:'18d 06h 42m'
  }
});
let A = loadState();
function loadState(){
  try{ const raw = localStorage.getItem(DB_KEY); return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState(); }
  catch(e){ return defaultState(); }
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(A)); }catch(e){} }
function logAction(action, detail){ A.logs.unshift({ ts:Date.now(), actor:'Admin', action, detail }); if(A.logs.length>120) A.logs.pop(); save(); }
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2300); }
const fmt = n => 'Br ' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt = ts => new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

const SECTIONS = [
  ['dashboard','📊 Dashboard'],['players','👥 Players'],['games','🎮 Games'],
  ['wallet','💰 Wallet'],['deposits','📥 Deposits'],['withdrawals','📤 Withdrawals'],
  ['winners','🏆 Winners'],['settings','⚙ Settings'],['broadcast','📢 Broadcast'],
  ['reports','📈 Reports'],['support','🎧 Support'],['staff','🛡 Staff & Roles'],
  ['security','🔐 Security & Logs'],['server','🖥 Server & Bot'],['db','🗄 DB & Migration']
];

function render(){
  const g=A.game, m=A.metrics;
  let body='';
  if(A.section==='dashboard'){
    body=`<div class="card"><h2>📊 Admin Dashboard</h2><div class="grid4">
      <div class="kpi"><small>Total Players</small><b>${m.totalPlayers + A.players.length - 4}</b></div>
      <div class="kpi"><small>Active Players</small><b class="ok">${m.activePlayers}</b></div>
      <div class="kpi"><small>New Players Today</small><b>${m.newPlayersToday}</b></div>
      <div class="kpi"><small>Total Games</small><b>${m.totalGames}</b></div>
      <div class="kpi"><small>Running Games</small><b class="warn">${m.runningGames}</b></div>
      <div class="kpi"><small>Completed Games</small><b>${m.completedGames}</b></div>
      <div class="kpi"><small>Today's Deposits</small><b class="ok">${fmt(m.depositsToday)}</b></div>
      <div class="kpi"><small>Today's Withdrawals</small><b class="bad">${fmt(m.withdrawalsToday)}</b></div>
      <div class="kpi"><small>Total Revenue</small><b class="ok">${fmt(m.totalRevenue)}</b></div>
      <div class="kpi"><small>Total Expenses</small><b>${fmt(m.totalExpenses)}</b></div>
      <div class="kpi"><small>Prizes Paid</small><b class="warn">${fmt(m.prizesPaid)}</b></div>
      <div class="kpi"><small>Pending Payments</small><b class="warn">${A.deposits.filter(d=>d.status==='pending').length + A.withdrawals.filter(w=>w.status==='pending').length}</b></div>
      <div class="kpi"><small>Bot Status</small><b class="${A.botOnline?'ok':'bad'}">${A.botOnline?'ONLINE':'OFFLINE'}</b></div>
      <div class="kpi"><small>Server Status</small><b class="${A.serverOnline?'ok':'bad'}">${A.serverOnline?'HEALTHY':'DOWN'}</b></div>
    </div></div>
    <div class="card"><h3>📡 Live Game Status</h3><div class="grid4">
      <div class="kpi"><small>Phase</small><b>${g.phase}</b></div>
      <div class="kpi"><small>Countdown</small><b>${g.countdown}s</b></div>
      <div class="kpi"><small>Game Code</small><b>${g.code}</b></div>
      <div class="kpi"><small>Boards / Pool</small><b>${g.boards} / ${fmt(g.pool)}</b></div>
    </div></div>`;
  } else if(A.section==='players'){
    const q=(A.playerSearch||'').toLowerCase();
    const list=A.players.filter(p=>!q||String(p.id).includes(q)||p.username.toLowerCase().includes(q)||p.name.toLowerCase().includes(q));
    body=`<div class="card"><h2>👥 Player Management</h2>
      <div class="row-gap" style="margin-bottom:10px"><input id="pSearch" placeholder="Search Telegram ID or @username..." value="${A.playerSearch||''}" style="max-width:340px"><button class="btn bl" onclick="applySearch()">Search</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Player</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${list.map(p=>`<tr><td><b>${p.id}</b></td><td>${p.name}<br><small style="color:var(--mu)">${p.username}</small></td><td><b>${fmt(p.balance)}</b></td><td><span class="pill ${p.status==='active'?'ok':p.status==='frozen'?'warn':'bad'}">${p.status.toUpperCase()}</span></td><td><div class="row-gap"><button class="btn gr" onclick="setPlayerStatus('${p.id}','active')">Active/Unban</button><button class="btn ye" onclick="setPlayerStatus('${p.id}','frozen')">Freeze</button><button class="btn rd" onclick="setPlayerStatus('${p.id}','banned')">Ban</button><button class="btn bl" onclick="msgPlayer('${p.username}')">Message</button></div></td></tr>`).join('')}
      </tbody></table></div></div>`;
  } else if(A.section==='games'){
    body=`<div class="card"><h2>🎮 Game Management</h2>
      <div class="row-gap" style="margin-bottom:12px">
        <button class="btn gr" onclick="gameAction('RUNNING','New game started')">▶ Create / Start</button>
        <button class="btn ye" onclick="gameAction('PAUSED','Game paused')">⏸ Pause</button>
        <button class="btn bl" onclick="gameAction('RUNNING','Game resumed')">⏯ Resume</button>
        <button class="btn rd" onclick="gameAction('CANCELLED','Game cancelled')">✖ Cancel</button>
        <button class="btn pu" onclick="gameAction('LOBBY','Game restarted')">↻ Restart</button>
      </div>
      <div class="grid3">
        <div class="field"><label>Entry Fee</label><input type="number" id="gEntry" value="${g.entryFee}"></div>
        <div class="field"><label>Card Price</label><input type="number" id="gCardPrice" value="${g.cardPrice}"></div>
        <div class="field"><label>Min / Max Players</label><input type="number" id="gMinP" value="${g.minPlayers}"></div>
      </div>
      <button class="btn bl" onclick="saveGameConfig()">Save Game Settings</button></div>`;
  } else if(A.section==='wallet'){
    body=`<div class="card"><h2>💰 Wallet Management (Audited)</h2>
      <div class="grid3">
        <div class="field"><label>Player</label><select id="wPlayer">${A.players.map(p=>`<option value="${p.id}">${p.username} (${fmt(p.balance)})</option>`).join('')}</select></div>
        <div class="field"><label>Amount</label><input type="number" id="wAmt" placeholder="100"></div>
        <div class="field"><label>Audit Reason</label><input id="wReason" placeholder="Reason required"></div>
      </div>
      <div class="row-gap"><button class="btn gr" onclick="adjustWallet(1)">+ Add Money</button><button class="btn rd" onclick="adjustWallet(-1)">− Deduct Money</button></div></div>
      <div class="card"><h3>📜 Transaction Audit Log</h3><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Player</th><th>Type</th><th>Amount</th><th>Reason</th><th>Time</th></tr></thead><tbody>
      ${A.transactions.map(t=>`<tr><td>${t.id}</td><td>${t.player}</td><td>${t.type}</td><td class="${t.amount>=0?'ok':'bad'}">${t.amount>=0?'+':''}${fmt(t.amount)}</td><td>${t.reason}</td><td>${dt(t.ts)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  } else if(A.section==='deposits'){
    body=`<div class="card"><h2>📥 Deposit Management</h2><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Player</th><th>Amount</th><th>Ref</th><th>Status</th><th>Action</th></tr></thead><tbody>
    ${A.deposits.map(d=>`<tr><td>${d.id}</td><td>${d.player}</td><td><b>${fmt(d.amount)}</b></td><td>${d.ref}</td><td><span class="pill ${d.status==='approved'?'ok':d.status==='pending'?'warn':'bad'}">${d.status.toUpperCase()}</span></td><td>${d.status==='pending'?`<div class="row-gap"><button class="btn gr" onclick="decideDeposit('${d.id}','approved')">Approve</button><button class="btn rd" onclick="decideDeposit('${d.id}','rejected')">Reject</button></div>`:'Done'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  } else if(A.section==='withdrawals'){
    body=`<div class="card"><h2>📤 Withdrawal Management</h2><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Player</th><th>Amount</th><th>Destination</th><th>Status</th><th>Action</th></tr></thead><tbody>
    ${A.withdrawals.map(w=>`<tr><td>${w.id}</td><td>${w.player}</td><td><b>${fmt(w.amount)}</b></td><td>${w.method} · ${w.dest}</td><td><span class="pill ${w.status==='paid'?'ok':w.status==='pending'?'warn':'bad'}">${w.status.toUpperCase()}</span></td><td>${w.status==='pending'?`<div class="row-gap"><button class="btn gr" onclick="decideWithdrawal('${w.id}','paid')">Mark Paid</button><button class="btn rd" onclick="decideWithdrawal('${w.id}','rejected')">Reject</button></div>`:'Done'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  } else if(A.section==='winners'){
    body=`<div class="card"><h2>🏆 Winner & Prize Verification</h2><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Game</th><th>Player</th><th>Board & Pattern</th><th>Prize</th><th>Action</th></tr></thead><tbody>
    ${A.winners.map(w=>`<tr><td>${w.id}</td><td>${w.gameCode}</td><td><b>${w.player}</b></td><td>#${w.board} · ${w.pattern}</td><td class="ok"><b>${fmt(w.prize)}</b></td><td>${!w.paid?`<button class="btn gr" onclick="payPrize('${w.id}')">Approve Prize</button>`:'<span class="pill ok">PAID</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  } else if(A.section==='settings'){
    body=`<div class="card"><h2>⚙ Game Settings</h2><div class="grid3">
      <div class="field"><label>Prize Pool (%)</label><input type="number" id="sPct" value="${g.prizePct}"></div>
      <div class="field"><label>Max Cards / Player</label><input type="number" id="sMaxC" value="${g.maxCards}"></div>
      <div class="field"><label>Call Interval (sec)</label><input type="number" id="sInt" value="${g.callIntervalSec}"></div>
    </div><div class="field"><label>Rules</label><textarea id="sRules" rows="2">${g.rules}</textarea></div><button class="btn gr" onclick="saveGlobalSettings()">Save Settings</button></div>`;
  } else if(A.section==='broadcast'){
    body=`<div class="card"><h2>📢 Notification & Broadcast</h2><div class="grid2">
      <div class="field"><label>Target</label><select id="bAud"><option>All Players</option><option>Selected Players</option><option>Winners</option></select></div>
      <div class="field"><label>Type</label><select id="bType"><option>Game Announcement</option><option>Winner Announcement</option><option>Payment Confirmation</option><option>New Game</option></select></div>
    </div><div class="field"><label>Message</label><textarea id="bMsg" rows="3" placeholder="Announcement text..."></textarea></div><button class="btn bl" onclick="sendBroadcast()">Send Broadcast</button></div>`;
  } else if(A.section==='reports'){
    const net = m.totalRevenue - m.totalExpenses;
    const liab = A.players.reduce((s,p)=>s+(+p.balance||0)+(+p.bonus||0),0);
    body=`<div class="card"><h2>📈 Reports & Statistics</h2><div class="grid4">
      <div class="kpi"><small>Total Income</small><b class="ok">${fmt(m.totalRevenue)}</b></div>
      <div class="kpi"><small>Expenses + Prizes</small><b class="bad">${fmt(m.totalExpenses+m.prizesPaid)}</b></div>
      <div class="kpi"><small>Net Profit</small><b class="ok">${fmt(net)}</b></div>
      <div class="kpi"><small>Player Liabilities</small><b class="warn">${fmt(liab)}</b></div>
    </div><button class="btn gr" style="margin-top:12px" onclick="exportCsv()">⬇ Export CSV</button></div>`;
  } else if(A.section==='support'){
    body=`<div class="card"><h2>🎧 Support Tickets</h2>${A.tickets.map(t=>`<div class="kpi" style="margin-bottom:8px"><b>${t.id} · ${t.player} (${t.category})</b><p style="margin:6px 0">${t.message}</p><button class="btn gr" onclick="closeTicket('${t.id}')">Close Ticket</button></div>`).join('')}</div>`;
  } else if(A.section==='staff'){
    body=`<div class="card"><h2>🛡 Admin & Staff Management</h2><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Role</th></tr></thead><tbody>${A.staff.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td><span class="pill ok">${s.role}</span></td></tr>`).join('')}</tbody></table></div></div>`;
  } else if(A.section==='security'){
    body=`<div class="card"><h2>🔐 Security & Activity Logs</h2><div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>${A.logs.map(l=>`<tr><td>${dt(l.ts)}</td><td>${l.actor}</td><td><span class="pill warn">${l.action}</span></td><td>${l.detail}</td></tr>`).join('')}</tbody></table></div></div>`;
  } else if(A.section==='server'){
    body=`<div class="card"><h2>🖥 Server & Bot Control</h2><div class="grid4" style="margin-bottom:12px">
      <div class="kpi"><small>CPU</small><b>${m.cpu}</b></div><div class="kpi"><small>RAM</small><b>${m.ram}</b></div>
      <div class="kpi"><small>Disk</small><b>${m.disk}</b></div><div class="kpi"><small>Uptime</small><b>${m.uptime}</b></div>
    </div><div class="row-gap"><button class="btn gr" onclick="toggleBot(true)">Bot Online</button><button class="btn rd" onclick="toggleBot(false)">Bot Offline</button><button class="btn ye" onclick="restartBot()">↻ Restart Bot</button></div></div>`;
  } else if(A.section==='db'){
    body=`<div class="card"><h2>🗄 Database, Backups & Safe Migration</h2><p style="color:var(--mu);font-size:13px">Existing accounts, balances, transaction history, and game history are preserved safely.</p>
      <button class="btn gr" style="margin-bottom:10px" onclick="createBackup()">+ Create Backup Now</button>
      <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Created</th><th>Size</th><th>Note</th></tr></thead><tbody>${A.backups.map(b=>`<tr><td><b>${b.id}</b></td><td>${dt(b.ts)}</td><td>${b.size}</td><td>${b.note}</td></tr>`).join('')}</tbody></table></div></div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="top">
      <div class="brand"><span style="font-size:26px">🎬</span><div><h1>Zina Bingo Studio</h1><small>Full Admin Panel · Data Preserved</small></div></div>
      <div class="actions"><a class="btn bl" href="/" style="text-decoration:none">🎮 Mini App</a><button class="btn gr" onclick="save();toast('Saved')">↻ Sync</button></div>
    </div>
    <div class="tabs">${SECTIONS.map(([k,l])=>`<button class="tab ${A.section===k?'act':''}" onclick="setSec('${k}')">${l}</button>`).join('')}</div>
    ${body}`;
}

window.setSec=k=>{A.section=k;save();render()};
window.applySearch=()=>{A.playerSearch=document.getElementById('pSearch').value;render()};
window.setPlayerStatus=(id,st)=>{const p=A.players.find(x=>x.id===id);if(p){p.status=st;logAction('PLAYER_STATUS',`${p.username} -> ${st}`);save();render();toast('Updated')}}
window.msgPlayer=u=>{logAction('MSG',`Sent message to ${u}`);toast('Message sent to '+u)}
window.gameAction=(ph,msg)=>{A.game.phase=ph;logAction('GAME',msg);save();render();toast(msg)}
window.saveGameConfig=()=>{A.game.entryFee=+document.getElementById('gEntry').value||10;A.game.cardPrice=+document.getElementById('gCardPrice').value||10;A.game.minPlayers=+document.getElementById('gMinP').value||2;logAction('GAME_CFG','Updated');save();render();toast('Saved')}
window.adjustWallet=dir=>{
  const pid=document.getElementById('wPlayer').value, amt=Math.abs(+document.getElementById('wAmt').value||0), reason=(document.getElementById('wReason').value||'').trim();
  if(!amt||!reason)return toast('Amount & audit reason required');
  const p=A.players.find(x=>x.id===pid); if(!p)return;
  const d=dir*amt; p.balance=Math.max(0,p.balance+d);
  A.transactions.unshift({id:'TX-'+Date.now().toString().slice(-5),player:p.username,type:dir>0?'credit':'debit',amount:d,reason,ts:Date.now()});
  logAction('WALLET',`${p.username} ${d>=0?'+':''}${d} (${reason})`); save(); render(); toast('Recorded');
}
window.decideDeposit=(id,st)=>{const d=A.deposits.find(x=>x.id===id);if(!d||d.status!=='pending')return;d.status=st;if(st==='approved'){const p=A.players.find(x=>x.id===d.playerId);if(p){p.balance+=d.amount;p.deposited+=d.amount}A.metrics.depositsToday+=d.amount}logAction('DEPOSIT_'+st.toUpperCase(),id);save();render();toast('Deposit '+st)}
window.decideWithdrawal=(id,st)=>{const w=A.withdrawals.find(x=>x.id===id);if(!w||w.status!=='pending')return;w.status=st;if(st==='paid'){const p=A.players.find(x=>x.id===w.playerId);if(p){p.balance=Math.max(0,p.balance-w.amount);p.withdrawn+=w.amount}A.metrics.withdrawalsToday+=w.amount}logAction('WITHDRAWAL_'+st.toUpperCase(),id);save();render();toast('Withdrawal '+st)}
window.payPrize=id=>{const w=A.winners.find(x=>x.id===id);if(!w)return;w.paid=true;A.metrics.prizesPaid+=w.prize;logAction('PRIZE_PAID',id);save();render();toast('Prize approved')}
window.saveGlobalSettings=()=>{A.game.prizePct=+document.getElementById('sPct').value||80;A.game.maxCards=+document.getElementById('sMaxC').value||2;A.game.callIntervalSec=+document.getElementById('sInt').value||4;A.game.rules=document.getElementById('sRules').value;logAction('SETTINGS','Saved');save();render();toast('Settings saved')}
window.sendBroadcast=()=>{const m=(document.getElementById('bMsg').value||'').trim();if(!m)return toast('Write message');logAction('BROADCAST',m);save();toast('Broadcast sent')}
window.exportCsv=()=>{const csv='Metric,Value\nRevenue,'+A.metrics.totalRevenue+'\nExpenses,'+A.metrics.totalExpenses+'\nPrizes,'+A.metrics.prizesPaid;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='zina-bingo-report.csv';a.click();toast('CSV exported')}
window.closeTicket=id=>{const t=A.tickets.find(x=>x.id===id);if(t){t.status='closed';logAction('TICKET_CLOSED',id);save();render();toast('Closed')}}
window.toggleBot=on=>{A.botOnline=on;logAction('BOT',on?'ONLINE':'OFFLINE');save();render();toast(on?'Bot ONLINE':'Bot OFFLINE')}
window.restartBot=()=>{logAction('BOT_RESTART','Restarted');toast('Bot restarting...')}
window.createBackup=()=>{const id='BKP-'+Date.now().toString().slice(-6);A.backups.unshift({id,ts:Date.now(),size:'5.0 MB',note:'Snapshot created safely'});logAction('BACKUP',id);save();render();toast('Backup created')}
render();
</script>
</body>
</html>`);
