<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zina Bingo — 75-Ball Multiplayer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Ethiopic', system-ui, sans-serif;
      background: #070d19;
      color: #f8fafc;
      min-height: 100vh;
      padding: 12px;
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #111c33;
      border: 1px solid #233558;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 800;
      font-size: 16px;
      color: #38bdf8;
    }
    .wallet-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 700;
    }
    .pill {
      background: #091120;
      border: 1px solid #263b63;
      border-radius: 999px;
      padding: 5px 10px;
    }
    .pill span { color: #4ade80; }
    .pill.bonus span { color: #facc15; }
    .status-card {
      background: #111c33;
      border: 1px solid #233558;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .status-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }
    .stat-box {
      background: #091120;
      border: 1px solid #1b2c4c;
      border-radius: 10px;
      padding: 8px 6px;
    }
    .stat-lbl { font-size: 11px; color: #94a3b8; }
    .stat-val { font-size: 15px; font-weight: 800; margin-top: 2px; color: #f8fafc; }
    .call-banner {
      margin-top: 10px;
      background: linear-gradient(90deg, #1d4ed8, #0284c7);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .last-ball {
      background: #f8fafc;
      color: #091120;
      font-weight: 800;
      font-size: 18px;
      min-width: 56px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }
    .called-strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-top: 8px;
    }
    .mini-ball {
      flex: 0 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 7px;
    }
    .my-boards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .bingo-card {
      background: #111c33;
      border: 1px solid #2b416b;
      border-radius: 14px;
      padding: 10px;
    }
    .bingo-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 13px;
    }
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .cell {
      aspect-ratio: 1;
      border-radius: 8px;
      background: #091120;
      border: 1px solid #223558;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }
    .cell.free { background: #334155; color: #facc15; font-size: 10px; }
    .cell.marked { background: #16a34a; color: #ffffff; border-color: #22c55e; }
    .cell.win-cell { background: #eab308; color: #091120; border-color: #fef08a; }
    .picker-card {
      background: #111c33;
      border: 1px solid #233558;
      border-radius: 14px;
      padding: 12px;
    }
    .picker-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .boards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
      max-height: 310px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .b-btn {
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid #2a3f66;
      background: #091120;
      color: #e2e8f0;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
    .b-btn.mine { background: #2563eb; border-color: #60a5fa; color: #fff; }
    .b-btn.taken { background: #3f1d2e; border-color: #9f1239; color: #fda4af; cursor: not-allowed; opacity: 0.75; }
    .win-banner {
      display: none;
      background: #14532d;
      border: 1px solid #22c55e;
      color: #dcfce7;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .toast {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      z-index: 99;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">🎯 Zina Bingo</div>
      <div class="wallet-pills">
        <div class="pill">Main: <span id="wMain">0.00</span> ብር</div>
        <div class="pill bonus">Bonus: <span id="wBonus">0.00</span> ብር</div>
      </div>
    </div>

    <div class="win-banner" id="winBanner"></div>

    <div class="status-card">
      <div class="status-row">
        <div class="stat-box">
          <div class="stat-lbl">Phase</div>
          <div class="stat-val" id="stPhase">LOBBY</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Timer</div>
          <div class="stat-val" id="stTimer">30s</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Stake</div>
          <div class="stat-val" id="stStake">10 ብር</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Prize Pool</div>
          <div class="stat-val" id="stPool">0 ብር</div>
        </div>
      </div>

      <div class="call-banner">
        <div>
          <div style="font-size:11px;opacity:0.9;" id="stGameCode">Round #1</div>
          <div style="font-size:13px;font-weight:800;" id="stStatusText">ካርቴላ ይምረጡ (እስከ 2 ካርቴላ)</div>
        </div>
        <div class="last-ball" id="lastBall">--</div>
      </div>

      <div class="called-strip" id="calledStrip"></div>
    </div>

    <div class="my-boards" id="myBoards"></div>

    <div class="picker-card">
      <div class="picker-top">
        <div style="font-weight:800;font-size:13px;">ካርቴላ ምረጥ (1 - 600) · የተያዙ: <span id="bookedCount">0</span></div>
        <div style="font-size:11px;color:#94a3b8;" id="playerLabel">Player</div>
      </div>
      <div class="boards-grid" id="boardsGrid"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const playerInfo = {
      id: tgUser && tgUser.id ? String(tgUser.id) : ('guest_' + Math.random().toString(36).slice(2, 8)),
      name: (tgUser && (tgUser.first_name || tgUser.username)) || 'Player'
    };
    document.getElementById('playerLabel').textContent = playerInfo.name + ' (' + playerInfo.id + ')';

    const socket = io();
    let state = {
      phase: 'lobby',
      t: 30,
      stake: 10,
      pool: 0,
      gcode: '',
      booked: {},
      mine: [],
      called: [],
      pickedGrids: {},
      winCellsByBoard: {}
    };

    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    function updateWallet(w) {
      if (!w) return;
      document.getElementById('wMain').textContent = Number(w.main ?? 0).toFixed(2);
      document.getElementById('wBonus').textContent = Number(w.bonus ?? 0).toFixed(2);
    }

    function renderStatus() {
      const phaseLabel = state.phase === 'lobby' ? 'LOBBY' : (state.phase === 'play' ? 'PLAYING' : 'FINISHED');
      document.getElementById('stPhase').textContent = phaseLabel;
      document.getElementById('stTimer').textContent = (state.t ?? 0) + 's';
      document.getElementById('stStake').textContent = (state.stake ?? 10) + ' ብር';
      document.getElementById('stPool').textContent = (state.pool ?? 0) + ' ብር';
      document.getElementById('stGameCode').textContent = 'Game: ' + (state.gcode || '#');
      document.getElementById('stStatusText').textContent =
        state.phase === 'lobby'
          ? 'ካርቴላ ይምረጡ ወይም ይቀይሩ (እስከ 2 ካርቴላ)'
          : (state.phase === 'play' ? 'ቁጥሮች እየተጠሩ ነው...' : 'ጨዋታው ተጠናቋል');

      const called = Array.isArray(state.called) ? state.called : [];
      document.getElementById('lastBall').textContent = called.length ? called[called.length - 1] : '--';
      document.getElementById('calledStrip').innerHTML = called.slice(-15).reverse().map(n =>
        `<div class="mini-ball">${n}</div>`
      ).join('');
    }

    function renderBoardsGrid() {
      const box = document.getElementById('boardsGrid');
      const booked = state.booked || {};
      const mineSet = new Set(state.mine || []);
      document.getElementById('bookedCount').textContent = Object.keys(booked).length;

      let html = '';
      for (let i = 1; i <= 600; i++) {
        const isMine = mineSet.has(i);
        const isTaken = Boolean(booked[i]) && !isMine;
        const cls = isMine ? 'b-btn mine' : (isTaken ? 'b-btn taken' : 'b-btn');
        html += `<button class="${cls}" type="button" ${isTaken ? 'disabled' : ''} onclick="toggleBoard(${i})">${i}</button>`;
      }
      box.innerHTML = html;
    }

    function renderMyBoards() {
      const box = document.getElementById('myBoards');
      const calledSet = new Set(state.called || []);
      const mine = state.mine || [];

      if (!mine.length) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = mine.map(boardId => {
        const data = state.pickedGrids[boardId];
        const winSet = new Set((state.winCellsByBoard[boardId] || []).map(c => c[0] + ',' + c[1]));
        let cellsHtml = '';
        if (data && Array.isArray(data.grid)) {
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
              const val = data.grid[r][c];
              const isFree = val === 'FREE';
              const isMarked = isFree || calledSet.has(val);
              const isWin = winSet.has(r + ',' + c);
              const cls = isWin ? 'cell win-cell' : (isFree ? 'cell free' : (isMarked ? 'cell marked' : 'cell'));
              cellsHtml += `<div class="${cls}">${isFree ? 'FREE' : val}</div>`;
            }
          }
        }
        return `
          <div class="bingo-card">
            <div class="bingo-head">
              <span>ካርቴላ #${boardId}</span>
              <span style="font-size:11px;color:#38bdf8;">${state.phase === 'lobby' ? 'ተመርጧል' : 'በጨዋታ ላይ'}</span>
            </div>
            <div class="bingo-grid">${cellsHtml}</div>
          </div>`;
      }).join('');
    }

    function toggleBoard(boardId) {
      if (state.phase !== 'lobby') {
        return showToast('በLOBBY ወቅት ብቻ መምረጥ ይቻላል');
      }
      if ((state.mine || []).includes(boardId)) {
        socket.emit('board:unpick', { board: boardId });
      } else {
        socket.emit('board:pick', { board: boardId });
      }
    }

    socket.on('connect', () => {
      socket.emit('room:join', { user: playerInfo, stake: state.stake });
    });

    socket.on('room:state', (payload) => {
      if (payload.phase === 'lobby') {
        state.winCellsByBoard = {};
        document.getElementById('winBanner').style.display = 'none';
      }
      state.phase = payload.phase || state.phase;
      state.t = payload.t ?? state.t;
      state.stake = payload.stake ?? state.stake;
      state.pool = payload.pool ?? state.pool;
      state.gcode = payload.gcode ?? state.gcode;
      if (payload.booked) state.booked = payload.booked;
      if (Array.isArray(payload.mine)) {
        state.mine = payload.mine;
        for (const bId of Object.keys(state.pickedGrids)) {
          if (!state.mine.includes(Number(bId))) delete state.pickedGrids[bId];
        }
      }
      if (Array.isArray(payload.called)) state.called = payload.called;
      if (payload.wallet) updateWallet(payload.wallet);
      renderStatus();
      renderBoardsGrid();
      renderMyBoards();
    });

    socket.on('board:picked', ({ board, grid }) => {
      state.pickedGrids[board] = grid;
      if (!state.mine.includes(board)) state.mine.push(board);
      renderBoardsGrid();
      renderMyBoards();
    });

    socket.on('board:taken', ({ booked }) => {
      if (booked) state.booked = booked;
      renderBoardsGrid();
    });

    socket.on('board:released', ({ board, booked }) => {
      delete state.pickedGrids[board];
      state.mine = (state.mine || []).filter(id => id !== board);
      if (booked) state.booked = booked;
      renderBoardsGrid();
      renderMyBoards();
    });

    socket.on('board:rejected', ({ reason }) => {
      if (reason === 'max_boards') showToast('ከ2 ካርቴላ በላይ መምረጥ አይቻልም');
      else if (reason === 'taken') showToast('ይህ ካርቴላ ተይዟል');
      else showToast('አሁን መምረጥ አይቻልም');
    });

    socket.on('game:start', ({ pool, gcode }) => {
      state.phase = 'play';
      state.pool = pool ?? state.pool;
      state.gcode = gcode ?? state.gcode;
      state.called = [];
      state.winCellsByBoard = {};
      document.getElementById('winBanner').style.display = 'none';
      renderStatus();
      renderMyBoards();
    });

    socket.on('game:call', ({ called }) => {
      if (Array.isArray(called)) state.called = called;
      renderStatus();
      renderMyBoards();
    });

    socket.on('game:win', (payload) => {
      state.phase = 'win';
      state.t = payload.t ?? 8;
      if (Array.isArray(payload.called)) state.called = payload.called;
      const winners = Array.isArray(payload.winners) ? payload.winners : [];
      state.winCellsByBoard = {};
      for (const w of winners) {
        if (w.board && Array.isArray(w.cells)) {
          state.winCellsByBoard[w.board] = w.cells;
        }
      }
      const banner = document.getElementById('winBanner');
      if (winners.length > 0) {
        const names = winners.map(w => `${w.name} (ካርቴላ #${w.board} · ${w.pattern})`).join(', ');
        banner.innerHTML = `🏆 አሸናፊ: ${names} — ሽልማት: <b>${payload.prize} ብር</b>`;
      } else {
        banner.textContent = payload.message || 'በዚህ ዙር አሸናፊ አልተገኘም።';
      }
      banner.style.display = 'block';
      renderStatus();
      renderMyBoards();
    });

    socket.on('wallet:update', (w) => {
      updateWallet(w);
    });

    renderStatus();
    renderBoardsGrid();
  </script>
</body>
</html>
