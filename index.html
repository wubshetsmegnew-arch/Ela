.cards.n1 .card{padding:8px}.cards.n1 .card .t{font-size:13px;color:#fff;justify-content:center;gap:10px;margin-bottom:6px}.cards.n1 .cg{gap:4px}.cards.n1 .cg .h{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0;border-radius:9px}.cards.n1 .cg .c{aspect-ratio:1;height:auto;font-size:19px;border-radius:9px}
.cards.n2 .card{padding:5px;margin-bottom:6px}.cards.n2 .card .t{margin-bottom:3px}.cards.n2 .cg{gap:2px}.cards.n2 .cg .h{font-size:12px;padding:2px 0}.cards.n2 .cg .c{aspect-ratio:auto;height:26px;font-size:14px;border-radius:6px}
.top{flex-wrap:nowrap;gap:5px}.top .btn{padding:9px 10px;font-size:13px}.top .pill{padding:6px 8px}.top .timer{padding:6px 9px;font-size:18px}

@media(prefers-reduced-motion:reduce){.modal h1,.rf .ic.spin{animation:none}}

<script>
const L='BINGO',CL={B:'#F59E0B',I:'#10B981',N:'#3B82F6',G:'#EF4444',O:'#8B5CF6'};
const $=s=>document.querySelector(s),ltr=n=>L[Math.floor((n-1)/15)];
const NAMES=['Abebe','Tigist','Dawit','Selam','Kebede','Hana','Yonas','Meron','Biniam','Rahel','Samuel','Lidya','Mulu','Fikir','Henok','Saba'];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genCard(id){const r=rng(id*7919+13),c=[];for(let k=0;k<5;k++){const p=[...Array(15)].map((_,i)=>k*15+i+1);for(let i=14;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}c.push(p.slice(0,5))}c[2][2]=0;return c}
const LINES=[];for(let i=0;i<5;i++){LINES.push([...Array(5)].map((_,k)=>[k,i]));LINES.push([...Array(5)].map((_,k)=>[i,k]))}
LINES.push([...Array(5)].map((_,k)=>[k,k]),[...Array(5)].map((_,k)=>[k,4-k]));
const CORNERS=[[0,0],[4,0],[0,4],[4,4]],MINCALLS=12;
const PATS=[];for(let i=0;i<5;i++){PATS.push({t:'h',c:[0,1,2,3,4].map(k=>[k,i])});PATS.push({t:'v',c:[0,1,2,3,4].map(k=>[i,k])})}
PATS.push({t:'d',c:[0,1,2,3,4].map(k=>[k,k])},{t:'d',c:[0,1,2,3,4].map(k=>[k,4-k])},{t:'c',c:CORNERS});
const PNAME={h:'Horizontal Line · ወደጎን መስመር',v:'Vertical Line · ወደታች መስመር',d:'Diagonal Line · ሰያፍ መስመር',c:'4 Corners · አራቱ ማእዘናት'};
const winLine=(c,s,cs)=>PATS.find(p=>p.c.every(([x,y])=>{const n=c[x][y];return n===0||(cs.has(n)&&s.has(n))}));
const S={phase:'lobby',t:30,tick:0,room:null,rn:1,rooms:[{s:10,n:1},{s:10,n:2}],paid:{},cards:{},claimed:{},bonus:0,dep:0,tx:[],won:0,hide:true,wtab:'bal',gcode:'',booked:{},mine:[],marks:{},wallet:0,stake:10,round:1,gid:1042,called:[],auto:true,sound:true,tab:'game',left:false,win:null,hist:[],pool:0,players:0};
const card=id=>(S.cards&&S.cards[id])||genCard(id);
const APP='Zina Bingo',UID=String(10000000+Math.floor(Math.random()*9e7));
const fmt=n=>'Br '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),tot=()=>S.wallet+S.bonus,rid=()=>Math.random().toString(36).slice(2,10).toUpperCase(),rb=()=>1+Math.floor(Math.random()*600);
function addTx(l,a){S.tx.unshift({l,a,ts:Date.now()})}
function pay(id){if(tot()<S.stake){S.paid[id]=0;return}if(S.wallet>=S.stake)S.wallet-=S.stake;else{S.bonus-=S.stake-S.wallet;S.wallet=0}S.paid[id]=1;addTx('Board stake',-S.stake)}
function settle(){if(S.phase==='lobby')S.mine.forEach(id=>{if(!S.paid[id])pay(id)})}
const low=need=>`<div class="low"><b>⚠ Insufficient balance <span class="am2">· በቂ ባላንስ የለዎትም</span></b><small>Need ${fmt(need)} · you have ${fmt(tot())}. Test mode: boards can still be picked for free.</small><div class="bar" style="margin-top:8px"><button class="btn grn" data-a="dep" data-v="100">+ Top up 100 (test)</button><button class="btn" data-a="tab" data-t="wallet">Open Wallet</button></div></div>`;
function refund(id){if(S.paid[id]){S.wallet+=S.stake;addTx('Board refund',S.stake)}delete S.paid[id]}
let down=0;document.addEventListener('pointerdown',()=>down=1);['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>setTimeout(()=>down=0,60)));
const mini=(l,v)=>`<div class="mini"><small>${l}</small><b>${fmt(v)}</b></div>`;
const dt=ts=>new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
let ac;function beep(){if(!S.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=660;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch(e){}}
function botBook(n){for(let i=0;i<n;i++){const id=1+Math.floor(Math.random()*600);if(!S.booked[id])S.booked[id]=NAMES[Math.floor(Math.random()*16)]+' '+(10+Math.floor(Math.random()*90))}}
function start(){botBook(Math.max(0,12-Object.keys(S.booked).length));S.phase='play';S.called=[];S.tick=0;S.left=false;S.gid++;S.gcode=S.round+'_'+rid();const n=Object.keys(S.booked).length;S.players=n;S.pool=Math.floor(n*S.stake*80/100);S.mine.forEach(id=>S.marks[id]=new Set([0]))}
function call(){const rest=[...Array(75)].map((_,i)=>i+1).filter(n=>!S.called.includes(n));if(!rest.length)return;const n=rest[Math.floor(Math.random()*rest.length)];S.called.push(n);beep();
 if(S.auto)S.mine.forEach(id=>S.marks[id].add(n));
evalWin()}
function evalWin(){if(S.phase!=='play')return;const cs=new Set(S.called),hits=[];
 for(const k in S.booked){const id=+k,mine=S.mine.includes(id);if(!mine&&S.called.length<MINCALLS)continue;const set=mine?S.marks[id]:cs,c=card(id),p=winLine(c,set,cs);if(p&&p.c.every(([x,y])=>c[x][y]===0||(S.called.includes(c[x][y])&&set.has(c[x][y]))))hits.push({id,ln:p.c,pt:p.t,mine})}
 if(hits.length){const h=hits.find(x=>x.mine)||hits[Math.floor(Math.random()*hits.length)],name=h.mine?ME.name+' (You)':S.booked[h.id],prize=Math.floor(S.pool/hits.length),mh=hits.filter(x=>x.mine);S.phase='win';S.t=7;S.holdUntil=Date.now()+7000;S.win={...h,name,prize,called:[...S.called],wc:hits.length,pool:S.pool,co:hits.map(x=>({id:x.id,name:x.mine?'You':S.booked[x.id]}))};if(mh.length){S.wallet+=prize*mh.length;S.won++;addTx('Game prize',prize*mh.length)}if(S.mine.length)S.hist.unshift({gid:S.gcode,ts:Date.now(),stake:S.stake,prize,win:mh.length>0,my:[...S.mine],wb:hits.map(x=>x.id),wc:hits.length});
  }}
function newRound(){S.round++;S.phase='lobby';S.t=30;S.booked={};S.paid={};S.mine=[];S.marks={};S.called=[];S.win=null;S.left=false}
function tick(){if(LIVE){if(S.holdUntil){const r=Math.max(0,Math.ceil((S.holdUntil-Date.now())/1000));if(r!==S.t){S.t=r;render(1)}if(Date.now()>=S.holdUntil)endHold()}return}S.h=(S.h||0)+1;const sec=S.h%2===0;
 if(S.phase==='lobby'){if(!sec)return;S.t--;botBook(1+Math.floor(Math.random()*4));if(S.t<=0)start()}
 else if(S.phase==='play'){S.tick++;if(!(S.tick>=6&&(S.tick-6)%5===0))return;call()}
 else{const now=Date.now();if(!S.holdUntil)S.holdUntil=now+S.t*1000;if(now>=S.holdUntil){S.holdUntil=0;newRound()}else{const r=Math.ceil((S.holdUntil-now)/1000);if(r===S.t)return;S.t=r}}
 render()}
const ball=(n,s)=>`<div class="ball" style="--c:${CL[ltr(n)]};--s:${s}px"><i>${ltr(n)}</i><b>${n}</b></div>`;
const hdr=()=>[...L].map(x=>`<div class="h" style="background:${CL[x]}">${x}</div>`).join('');
function lobby(){const g=[];for(let i=1;i<=600;i++){const b=S.booked[i],m=S.mine.includes(i);g.push(`<div class="num ${m?'me':b?'bot':''} ${S.phase!=='lobby'?'lock':''}" data-a="pick" data-i="${i}">${i}</div>`)}
 const live=S.phase!=='lobby'?`<div class="ban"><span>Game in progress</span><button class="btn grn" data-a="watch">Watch live</button></div>`:'';
 return `<div class="main"><div class="bar top"><button class="btn red" data-a="leave">Leave</button><div class="timer">${S.phase==='lobby'?S.t+'s':'—'}</div><div class="pill"><small>Wallet</small><b>${Math.floor(tot())}</b></div><div class="pill"><small>Stake</small><b>${S.stake}</b></div><button class="btn rf" data-a="refresh"><span class="ic">⟳</span>Refresh</button></div>
 <div class="bar" style="margin-top:8px"><div class="pill"><small>Boards</small><b>${S.mine.length}/2</b></div><div class="pill"><b>${S.room?S.room.s:S.stake} № ${S.room?S.room.n:S.rn}</b></div></div>${(S.mine.some(id=>!S.paid[id])||S.lowNeed)?low(S.lowNeed||S.stake*S.mine.filter(id=>!S.paid[id]).length):''}${live}<div class="grid">${g.join('')}</div>${S.mine.length?`<div class="pv" style="grid-template-columns:repeat(${S.mine.length},1fr)">${S.mine.map(id=>`<div class="card" style="margin:0"><div class="t"><span>Cartela № ${id}</span></div>${cardHtml(id,new Set([0]))}</div>`).join('')}</div>`:''}</div>`}
function cardHtml(id,set,mode,wl){const c=card(id);let h='';for(let r=0;r<5;r++)for(let k=0;k<5;k++){const n=c[k][r],cl=S.called.includes(n),inW=wl&&wl.some(([x,y])=>x===k&&y===r);let cls='';
 if(mode==='win')cls=inW?'win':n===0?'fr':S.win.called.includes(n)?'yl':'';
 else cls=n===0?'fr':set.has(n)?'mk':cl?'cl':'';
 h+=`<div class="c ${cls}" data-a="cell" data-i="${id}" data-n="${n}">${n||'*'}</div>`}
 return `<div class="cg">${hdr()}${h}</div>`}

    w.push({...x,board:b,line:ln||[],pattern:pt})});

  const mh=w.filter(isMine),h=mh[0]||w[0],pool=d.pool!=null?d.pool:S.pool,prize=(d.prize!=null&&isFinite(+d.prize))?+d.prize:Math.floor(pool/w.length);
  const win={id:h.board,name:mh.length?ME.name+' (You)':h.name,ln:h.line,pt:h.pattern,mine:mh.length>0,called,wc:w.length,pool,prize,local:!!local,counted:holding?S.win.counted:0,co:w.map(x=>({id:x.board,name:isMine(x)?'You':x.name}))};
  const ent=S.hist.find(x=>x.gid===S.gcode);
  if(holding){S.win=win;if(ent){ent.prize=prize;ent.win=mh.length>0;ent.wb=w.map(x=>x.board);ent.wc=w.length}}
  else{S.phase='win';S.t=7;S.holdUntil=Date.now()+7000;S.queued=null;S.called=called;S.win=win;
    const my=S.played!=null?S.played:S.mine;if(my.length&&!ent)S.hist.unshift({gid:S.gcode,ts:Date.now(),stake:S.stake,prize,win:mh.length>0,my:[...my],wb:w.map(x=>x.board),wc:w.length})}
  if(mh.length&&!win.counted){S.won++;win.counted=1}
  if(d.wallet)applyWallet(d.wallet);
  render(1)}
function liveInit(){
  if(!window.io||SERVER_URL.includes('PASTE'))return;
  socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{userId:ME.id,name:ME.name,initData:ME.initData}});
  socket.on('connect',()=>{LIVE=true;const keep=S.wasConnected&&(S.phase==='play'||(S.holdUntil&&Date.now()<S.holdUntil));
    if(!keep){S.holdUntil=0;S.queued=null;S.played=null;S.mine=[];S.booked={};S.paid={};S.marks={};S.called=[];S.phase='lobby';S.win=null;S.claimed={}}
    if(!S.wasConnected){S.wallet=0;S.bonus=0;S.dep=0;S.wasConnected=1}
    if(S.room)liveJoin(S.room);render(1)});
  socket.on('disconnect',()=>{render(1)});
  socket.on('connect_error',()=>{});
  socket.on(EV.state,d=>{applyState(d);render()});
  socket.on(EV.taken,d=>{S.booked[d.board]=d.name||'Player';render()});
  socket.on(EV.freed,d=>{if(!S.mine.includes(+d.board))delete S.booked[d.board];render()});
  socket.on(EV.rejected,d=>{const b=+d.board;S.mine=S.mine.filter(x=>x!==b);delete S.paid[b];delete S.booked[b];if(d.reason==='insufficient')S.lowNeed=S.stake;render(1)});
  socket.on(EV.wallet,w=>{applyWallet(w);render(1)});
  socket.on(EV.card,d=>{if(d&&d.rows)setCards({[d.board]:d.rows});render()});
  socket.on(EV.start,d=>{const hold=S.holdUntil&&Date.now()<S.holdUntil;if(S.phase==='play'&&d.gcode&&d.gcode===S.gcode)return;if(!hold){S.claimed={};S.marks={};if(S.phase==='play')S.phase='lobby'}applyState({...d,phase:'play',called:[]});if(!hold){S.played=[...S.mine];S.left=false}render(1)});
  socket.on(EV.call,d=>{if(S.holdUntil&&Date.now()<S.holdUntil)return;S.called=d.called||[...S.called,d.n];if(S.auto)S.mine.forEach(id=>S.marks[id]&&S.marks[id].add(d.n));beep();S.mine.forEach(liveBingo);render(1)});
  socket.on(EV.win,d=>showWin(d,false));
}
liveInit();
