<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zina Bingo Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans Ethiopic', system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 14px; }
    .wrap { max-width: 980px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 14px; border: 1px solid #334155; }
    h2, h3 { margin: 0 0 10px 0; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .stat { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #263349; }
    .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; }
    .val { font-size: 17px; font-weight: 700; margin-top: 2px; color: #38bdf8; }
    .ok { color: #22c55e; }
    .warn { color: #facc15; }
    .bad { color: #f87171; }
    input, select, textarea { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 8px; font-family: inherit; }
    button, a.btn { cursor: pointer; border: none; border-radius: 8px; padding: 9px 12px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-family: inherit; }
    button:active, a.btn:active { transform: scale(0.98); }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-yellow { background: #eab308; color: #0f172a; }
    .btn-gray { background: #334155; color: #f8fafc; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; white-space: nowrap; }
    .tab.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
    .row-gap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .req-item { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .req-img { max-width: 100%; max-height: 240px; border-radius: 8px; margin: 8px 0; display: block; border: 1px solid #475569; cursor: zoom-in; }
    .badge { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pending { background: #f59e0b; color: #0f172a; }
    .approved { background: #16a34a; color: #fff; }
    .rejected { background: #dc2626; color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #263349; }
    th { color: #94a3b8; font-size: 11px; }
    .tbl-wrap { overflow-x: auto; }
    .toast { position: fixed; bottom: 16px; right: 16px; background: #16a34a; color: #fff; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; z-index: 999; }
    .img-ov { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
    .img-ov.show { display: flex; }
    .img-ov img { max-width: 100%; max-height: 85vh; border-radius: 10px; border: 2px solid #475569; }
  </style>
</head>
<body>
  <div class="wrap" id="studioRoot"></div>
  <div class="img-ov" id="imgLightbox" onclick="closeImgPreview()">
    <img id="imgLightboxEl" src="" alt="Screenshot Preview" onclick="event.stopPropagation()" />
  </div>

  <script>
    const ADMIN_IDS = ['7379955498'];
    const currentPin = '1219';
    const STORE_KEY = 'zina_studio_master_v4';
    let settingsInitialized = false;
    let liveCache = {
      phase: '-',
      countdown: '-',
      gameCode: '-',
      stake: 10,
      takenBoardsCount: 0,
      prizePool: 0,
      usersCount: 0,
      users: [],
      settings: {},
      requests: []
    };

    const SECTIONS = [
      ['dashboard', '📡 Dashboard & Live'],
      ['players', '👥 Players'],
      ['games', '🎮 Games'],
      ['wallet', '💳 Wallet & Audit'],
      ['requests', '📥 Deposits & Withdrawals'],
      ['winners', '🏆 Winners'],
      ['settings', '⚙️ Settings'],
      ['broadcast', '📢 Broadcast'],
      ['reports', '📈 Reports'],
      ['support', '🎧 Support & Staff'],
      ['system', '🖥 Server, Logs & DB']
    ];

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function openImgPreview(url) {
      const box = document.getElementById('imgLightbox');
      const img = document.getElementById('imgLightboxEl');
      if (!box || !img || !url) return;
      img.src = url;
      box.classList.add('show');
    }

    function closeImgPreview() {
      const box = document.getElementById('imgLightbox');
      if (box) box.classList.remove('show');
    }

    function getPin() {
      try {
        const q = new URLSearchParams(location.search);
        const p = (q.get('pin') || '').trim();
        if (p === currentPin || ADMIN_IDS.includes(p)) {
          sessionStorage.setItem('zina_adm_pin', p);
          return p;
        }
        return sessionStorage.getItem('zina_adm_pin') || currentPin;
      } catch (e) {
        return currentPin;
      }
    }

    function isAdminAuthorized() {
      try {
        const q = new URLSearchParams(location.search);
        if (q.get('admin') === '1' || q.get('pin') === currentPin || ADMIN_IDS.includes(String(q.get('pin') || ''))) {
          sessionStorage.setItem('zina_adm_ok', '1');
          return true;
        }
        if (sessionStorage.getItem('zina_adm_ok') === '1') return true;
        const tgUser = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
        if (tgUser && ADMIN_IDS.includes(String(tgUser.id))) {
          sessionStorage.setItem('zina_adm_ok', '1');
          return true;
        }
      } catch (e) {}
      return false;
    }

    function unlockStudio() {
      const input = document.getElementById('admUnlockInput');
      const val = (input ? input.value : '').trim();
      if (ADMIN_IDS.includes(val) || val === currentPin) {
        sessionStorage.setItem('zina_adm_ok', '1');
        sessionStorage.setItem('zina_adm_pin', val);
        settingsInitialized = false;
        toast('Admin access verified');
        renderLayout();
        loadAll();
      } else {
        toast('Admin ብቻ መግባት ይችላል');
      }
    }

    function defaultState() {
      return {
        activeSec: 'requests',
        botOnline: true,
        players: [
          { id: '7379955498', name: 'Admin', username: '@admin', balance: 2500, status: 'active' },
          { id: '100200301', name: 'Player 1', username: '@player1', balance: 420, status: 'active' },
          { id: '100200302', name: 'Player 2', username: '@player2', balance: 150, status: 'frozen' }
        ],
        winners: [
          { id: 'W-1', game: 'R1041', player: '@player1', board: '#44', pattern: 'Diagonal', prize: 320, paid: true }
        ],
        audit: [
          { user: '@admin', action: 'INIT', amount: 'Br 0.00', reason: 'Audit trail initialized' }
        ],
        tickets: [
          { id: 'TKT-1', player: '@player2', text: 'Deposit verification support', status: 'open' }
        ],
        backups: [
          { id: 'BKP-01', note: 'Existing accounts, balances & history preserved' }
        ]
      };
    }

    let EXT = loadState();
    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
      } catch (e) { return defaultState(); }
    }
    function saveState() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(EXT)); } catch (e) {}
    }
    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }
    function notifyAction(msg) {
      EXT.audit.unshift({ user: 'Admin', action: 'ACTION', amount: '-', reason: msg });
      saveState();
      renderAudit();
      toast('✅ ' + msg);
    }

    function headers() {
      return {
        'Content-Type': 'application/json',
        'x-admin-pin': getPin()
      };
    }

    function renderLayout() {
      const root = document.getElementById('studioRoot');
      if (!isAdminAuthorized()) {
        root.innerHTML = `
          <div class="card" style="max-width:420px;margin:36px auto;">
            <h2>🔒 Admin Access Only</h2>
            <p class="label">ይህ ገጽ ለAdmin ብቻ ነው። የAdmin ID ወይም PIN ያስገቡ።</p>
            <input type="password" id="admUnlockInput" placeholder="Admin ID or PIN" onkeydown="if(event.key==='Enter')unlockStudio()" />
            <button class="btn-green" type="button" style="width:100%;justify-content:center;" onclick="unlockStudio()">ክፈት / Unlock</button>
          </div>`;
        return;
      }

      root.innerHTML = `
        <div class="card">
          <div class="row-gap" style="justify-content:space-between;">
            <div>
              <h2 style="margin:0;">🎬 Zina Bingo Studio</h2>
              <span class="label" style="margin:2px 0 0 0;">Full Admin Control · ነባር ተጫዋቾችና ሂሳቦች ተጠብቀዋል</span>
            </div>
            <div class="row-gap">
              <a class="btn btn-blue" href="/" target="_blank">🎮 Mini App ክፈት</a>
              <button class="btn-gray" type="button" onclick="loadAll()">🔄 አድስ</button>
            </div>
          </div>
        </div>

        <div class="tabs" id="secTabs"></div>

        <div id="sec-dashboard" class="studio-sec">
          <div class="card">
            <h3>📡 የቀጥታ ጨዋታ ሁኔታ</h3>
            <div class="grid">
              <div class="stat"><div class="label">Phase</div><div class="val" id="sPhase">-</div></div>
              <div class="stat"><div class="label">Countdown</div><div class="val" id="sCount">-</div></div>
              <div class="stat"><div class="label">Game Code</div><div class="val" id="sCode">-</div></div>
              <div class="stat"><div class="label">Boards / Pool</div><div class="val" id="sPool">-</div></div>
            </div>
          </div>

          <div class="card">
            <h3>📊 Admin Dashboard</h3>
            <div class="grid4">
              <div class="stat"><div class="label">Registered Users (DB)</div><div class="val" id="dTotalPlayers">0</div></div>
              <div class="stat"><div class="label">Booked Boards</div><div class="val ok" id="dBookedBoards">0</div></div>
              <div class="stat"><div class="label">Pending Requests</div><div class="val warn" id="dPendingReqs">0</div></div>
              <div class="stat"><div class="label">Current Prize Pool</div><div class="val" id="dPrizePool">0 ብር</div></div>
              <div class="stat"><div class="label">Today's Deposits</div><div class="val ok">Br 14,850</div></div>
              <div class="stat"><div class="label">Today's Withdrawals</div><div class="val bad">Br 6,200</div></div>
              <div class="stat"><div class="label">Revenue / Expenses</div><div class="val">Br 98.4k / 14.2k</div></div>
              <div class="stat"><div class="label">Bot Status</div><div class="val ok" id="dPrizeBot">ONLINE</div></div>
            </div>
          </div>
        </div>

        <div id="sec-players" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>👥 Player Management</h3>
            <div class="row-gap" style="margin-bottom:10px;">
              <input type="text" id="playerQuery" placeholder="በTelegram ID ወይም @username ፈልግ..." style="margin:0;flex:1;min-width:200px;" oninput="renderPlayers()" />
              <button class="btn btn-blue" type="button" onclick="renderPlayers()">ፈልግ</button>
            </div>
            <div class="tbl-wrap">
              <table>
                <thead><tr><th>Telegram ID</th><th>Player</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="playersTbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="sec-games" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>🎮 Game Management</h3>
            <div class="row-gap" style="margin-bottom:12px;">
              <button class="btn btn-green" type="button" onclick="setGameState('RUNNING','አዲስ ጨዋታ ተጀምሯል')">▶ Start / New Game</button>
              <button class="btn btn-yellow" type="button" onclick="setGameState('PAUSED','ጨዋታው ቆሟል (Paused)')">⏸ Pause</button>
              <button class="btn btn-blue" type="button" onclick="setGameState('RUNNING','ጨዋታው ቀጥሏል (Resumed)')">⏯ Resume</button>
              <button class="btn btn-red" type="button" onclick="setGameState('CANCELLED','ጨዋታው ተሰርዟል')">✖ Cancel</button>
              <button class="btn btn-gray" type="button" onclick="setGameState('LOBBY','ጨዋታው እንደገና ተጀምሯል')">↻ Restart</button>
            </div>
            <div class="grid3">
              <div><span class="label">Min Players</span><input type="number" id="gmMinP" value="2" /></div>
              <div><span class="label">Max Players</span><input type="number" id="gmMaxP" value="600" /></div>
              <div><span class="label">Call Interval (sec)</span><input type="number" id="gmInterval" value="4" /></div>
            </div>
            <button class="btn btn-green" type="button" onclick="notifyAction('የጨዋታ ቅንብር ተቀምጧል')">💾 አስቀምጥ</button>
          </div>
        </div>

        <div id="sec-wallet" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>💳 የተጫዋች ሂሳብ ጨምር / ቀንስ</h3>
            <div class="grid">
              <input type="text" id="balUserId" placeholder="User ID (ለምሳሌ 7379955498)" />
              <input type="number" id="balDelta" placeholder="መጠን (ለምሳሌ 50 ወይም -20)" />
            </div>
            <input type="text" id="balReason" placeholder="የማስተካከያ ምክንያት (Audit Reason)" />
            <button class="btn btn-blue" type="button" onclick="adjustBalance()">ሂሳብ አዘምን</button>
          </div>

          <div class="card">
            <h3>📜 Financial Audit Trail</h3>
            <div class="tbl-wrap">
              <table>
                <thead><tr><th>User</th><th>Action</th><th>Amount</th><th>Reason</th></tr></thead>
                <tbody id="auditTbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="sec-requests" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>📥 Deposit & Withdraw ጥያቄዎች (Screenshot + Tx No)</h3>
            <div id="requestsList">በመጫን ላይ...</div>
          </div>
        </div>

        <div id="sec-winners" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>🏆 Winner & Prize Verification</h3>
            <div class="tbl-wrap">
              <table>
                <thead><tr><th>Game</th><th>Winner</th><th>Board & Pattern</th><th>Prize</th><th>Action</th></tr></thead>
                <tbody id="winnersTbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="sec-settings" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>⚙️ ቅንብሮችን አስተካክል (Edit Settings)</h3>
            <div class="label">Telebirr</div>
            <input type="text" id="cfgTelebirr" />
            <div class="label">CBE</div>
            <input type="text" id="cfgCbe" />
            <div class="grid">
              <div>
                <div class="label">Welcome Bonus (ብር)</div>
                <input type="number" id="cfgBonus" />
              </div>
              <div>
                <div class="label">Min Deposit (ብር)</div>
                <input type="number" id="cfgMinDep" />
              </div>
            </div>
            <div class="label">Min Withdraw (ብር)</div>
            <input type="number" id="cfgMinWdr" />
            <button class="btn btn-green" type="button" onclick="saveSettings()">💾 ቅንብሮችን አስቀምጥ</button>
          </div>
        </div>

        <div id="sec-broadcast" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>📢 Notification & Broadcast</h3>
            <div class="grid">
              <div>
                <span class="label">Audience</span>
                <select id="bcTarget">
                  <option value="All Players">All Players</option>
                  <option value="Selected Player">Selected Player</option>
                  <option value="Winners">Winners</option>
                </select>
              </div>
              <div>
                <span class="label">Type</span>
                <select id="bcType">
                  <option value="Game Announcement">Game Announcement</option>
                  <option value="Winner Announcement">Winner Announcement</option>
                  <option value="Payment Confirmation">Payment Confirmation</option>
                  <option value="New Game Alert">New Game Alert</option>
                </select>
              </div>
            </div>
            <textarea id="bcMessage" rows="3" placeholder="ለተጫዋቾች የሚላክ መልእክት ይጻፉ..."></textarea>
            <button class="btn btn-blue" type="button" onclick="sendBroadcast()">📤 Broadcast ላክ</button>
          </div>
        </div>

        <div id="sec-reports" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>📈 Reports & Statistics</h3>
            <div class="grid">
              <div class="stat"><div class="label">Net Profit</div><div class="val ok">Br 84,200.00</div></div>
              <div class="stat"><div class="label">Player Wallet Liabilities</div><div class="val warn">Br 3,070.00</div></div>
            </div>
            <div style="margin-top:10px;">
              <button class="btn btn-green" type="button" onclick="exportCsv()">⬇ Export CSV Report</button>
            </div>
          </div>
        </div>

        <div id="sec-support" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>🎧 Support Tickets</h3>
            <div id="ticketsBox"></div>
          </div>
          <div class="card">
            <h3>🛡 Admin & Staff Roles</h3>
            <div class="tbl-wrap">
              <table>
                <thead><tr><th>Role</th><th>Permissions</th></tr></thead>
                <tbody>
                  <tr><td>Super Admin</td><td>Full system & financial control</td></tr>
                  <tr><td>Finance Admin</td><td>Deposits, withdrawals, wallet audits</td></tr>
                  <tr><td>Game Manager</td><td>Games, cards, winners, settings</td></tr>
                  <tr><td>Support Admin</td><td>Player tickets & replies</td></tr>
                  <tr><td>Report Viewer</td><td>Read-only reports & exports</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="sec-system" class="studio-sec" style="display:none;">
          <div class="card">
            <h3>🖥 Server & Bot Control</h3>
            <div class="grid4" style="margin-bottom:10px;">
              <div class="stat"><div class="label">Bot Status</div><div class="val ok" id="sysBot">ONLINE</div></div>
              <div class="stat"><div class="label">CPU / RAM</div><div class="val">14% / 218MB</div></div>
              <div class="stat"><div class="label">Disk / DB</div><div class="val">1.2GB · OK</div></div>
              <div class="stat"><div class="label">Uptime</div><div class="val">18d 06h</div></div>
            </div>
            <div class="row-gap">
              <button class="btn btn-green" type="button" onclick="toggleBotStatus(true)">Bot Online</button>
              <button class="btn btn-red" type="button" onclick="toggleBotStatus(false)">Bot Offline</button>
              <button class="btn btn-yellow" type="button" onclick="notifyAction('Bot restart signal sent')">↻ Restart Bot</button>
            </div>
          </div>

          <div class="card">
            <h3>🗄 Database Backups & Safe Migration</h3>
            <p class="label">ነባር የተጫዋቾች መለያዎች፣ Telegram IDs፣ ባላንስ፣ ግብይት እና ጨዋታ ታሪኮች በማሻሻያ ወቅት ይጠበቃሉ።</p>
            <button class="btn btn-green" type="button" onclick="createBackup()">+ Create Database Backup</button>
            <div id="backupList" style="margin-top:10px;"></div>
          </div>
        </div>
      `;

      renderTabs();
      applyLiveToDom();
      renderPlayers();
      renderWinners();
      renderAudit();
      renderTickets();
      renderBackups();
    }

    function renderTabs() {
      const box = document.getElementById('secTabs');
      if (!box) return;
      box.innerHTML = SECTIONS.map(([id, label]) =>
        `<button class="btn tab ${EXT.activeSec === id ? 'active' : ''}" type="button" onclick="switchSec('${id}')">${escapeHtml(label)}</button>`
      ).join('');
      document.querySelectorAll('.studio-sec').forEach(el => {
        el.style.display = (el.id === 'sec-' + EXT.activeSec) ? 'block' : 'none';
      });
    }

    function switchSec(id) {
      EXT.activeSec = id;
      saveState();
      renderTabs();
    }

    function applyLiveToDom() {
      const d = liveCache;
      const pendingCount = (d.requests || []).filter(r => r.status === 'pending').length;
      if (document.getElementById('sPhase')) document.getElementById('sPhase').textContent = d.phase || '-';
      if (document.getElementById('sCount')) document.getElementById('sCount').textContent = (d.countdown != null && d.countdown !== '-' ? d.countdown + 's' : '-');
      if (document.getElementById('sCode')) document.getElementById('sCode').textContent = d.gameCode || '-';
      if (document.getElementById('sPool')) document.getElementById('sPool').textContent = (d.takenBoardsCount ?? 0) + 'b / ' + (d.prizePool ?? 0) + 'ብር';

      if (document.getElementById('dTotalPlayers')) document.getElementById('dTotalPlayers').textContent = String(d.usersCount ?? 0);
      if (document.getElementById('dBookedBoards')) document.getElementById('dBookedBoards').textContent = String(d.takenBoardsCount ?? 0);
      if (document.getElementById('dPendingReqs')) document.getElementById('dPendingReqs').textContent = String(pendingCount);
      if (document.getElementById('dPrizePool')) document.getElementById('dPrizePool').textContent = (d.prizePool ?? 0) + ' ብር';
      if (document.getElementById('dPrizeBot')) document.getElementById('dPrizeBot').textContent = EXT.botOnline ? 'ONLINE' : 'OFFLINE';
      if (document.getElementById('sysBot')) document.getElementById('sysBot').textContent = EXT.botOnline ? 'ONLINE' : 'OFFLINE';

      if (!settingsInitialized && d.settings && document.getElementById('cfgTelebirr')) {
        document.getElementById('cfgTelebirr').value = d.settings.telebirr || '';
        document.getElementById('cfgCbe').value = d.settings.cbe || '';
        document.getElementById('cfgBonus').value = d.settings.welcomeBonus ?? 0;
        document.getElementById('cfgMinDep').value = d.settings.minDeposit ?? 20;
        document.getElementById('cfgMinWdr').value = d.settings.minWithdraw ?? 50;
        settingsInitialized = true;
      }
      renderRequests(d.requests || []);
      renderPlayers();
    }

    async function loadAll() {
      if (!isAdminAuthorized()) return;
      try {
        const r = await fetch('/api/studio/data', { headers: headers() });
        if (!r.ok) {
          if (document.getElementById('requestsList')) {
            document.getElementById('requestsList').innerHTML = '<div style="color:#f87171;">ዳታ መጫን አልተቻለም (' + r.status + ')</div>';
          }
          return;
        }
        const d = await r.json();
        liveCache = {
          phase: d.live ? d.live.phase : '-',
          countdown: d.live ? d.live.countdown : '-',
          gameCode: d.live ? d.live.gameCode : '-',
          stake: d.live ? d.live.stake : 10,
          takenBoardsCount: d.live ? d.live.takenBoardsCount : 0,
          prizePool: d.live ? d.live.prizePool : 0,
          usersCount: d.usersCount ?? 0,
          users: d.users || [],
          settings: d.settings || {},
          requests: d.requests || []
        };
        applyLiveToDom();
      } catch (e) {
        if (document.getElementById('requestsList')) {
          document.getElementById('requestsList').innerHTML = '<div style="color:#f87171;">ስህተት: ' + escapeHtml(e.message) + '</div>';
        }
      }
    }

    function renderRequests(list) {
      const box = document.getElementById('requestsList');
      if (!box) return;
      if (!list.length) {
        box.innerHTML = '<div class="label">ምንም Deposit ወይም Withdraw ጥያቄ የለም።</div>';
        return;
      }
      box.innerHTML = list.map((req) => {
        const badgeClass = req.status === 'approved' ? 'approved' : (req.status === 'rejected' ? 'rejected' : 'pending');
        const safeId = escapeHtml(req.id);
        const rawUrl = String(req.photoUrl || '').trim();
        const safeUrl = escapeHtml(rawUrl);
        const imgHtml = rawUrl
          ? '<img class="req-img" src="' + safeUrl + '" alt="Screenshot" onclick="openImgPreview(\'' + safeUrl + '\')" />' +
            '<div class="row-gap" style="margin-bottom:6px;"><a class="btn btn-gray" href="' + safeUrl + '" target="_blank">🔍 Screenshot በአዲስ ገጽ ክፈት</a></div>'
          : '<div class="label">ምንም Screenshot አልተላከም</div>';
        const txHtml = req.txNumber ? '<div><b>Tx No:</b> <code>' + escapeHtml(req.txNumber) + '</code></div>' : '';
        const accHtml = req.accountInfo ? '<div><b>Account:</b> <code>' + escapeHtml(req.accountInfo) + '</code></div>' : '';
        const actionsHtml = req.status === 'pending'
          ? '<div style="margin-top:8px;">' +
              '<button class="btn-green" type="button" style="margin-right:8px;" onclick="decideReq(\'' + safeId + '\', \'approve\')">✅ Approve</button>' +
              '<button class="btn-red" type="button" onclick="decideReq(\'' + safeId + '\', \'reject\')">❌ Reject</button>' +
            '</div>'
          : '';
        return (
          '<div class="req-item">' +
            '<div style="display:flex; justify-content:space-between; align-items:center;">' +
              '<b>' + escapeHtml(String(req.type || '').toUpperCase()) + ' • ' + escapeHtml(req.amount) + ' ብር</b>' +
              '<span class="badge ' + badgeClass + '">' + escapeHtml(req.status) + '</span>' +
            '</div>' +
            '<div style="font-size:13px; margin-top:6px;">' +
              '<div><b>User:</b> ' + escapeHtml(req.userName || 'Player') + ' (<code>' + escapeHtml(req.userId) + '</code>)</div>' +
              txHtml +
              accHtml +
            '</div>' +
            imgHtml +
            actionsHtml +
          '</div>'
        );
      }).join('');
    }

    function renderPlayers() {
      const tbody = document.getElementById('playersTbody');
      if (!tbody) return;
      const q = (document.getElementById('playerQuery')?.value || '').toLowerCase();
      const sourceList = (Array.isArray(liveCache.users) && liveCache.users.length) ? liveCache.users : EXT.players;
      const rows = sourceList.filter(p =>
        !q ||
        String(p.id).toLowerCase().includes(q) ||
        String(p.username || '').toLowerCase().includes(q) ||
        String(p.name || '').toLowerCase().includes(q)
      );
      tbody.innerHTML = rows.map(p => {
        const bal = Number(p.main ?? p.balance ?? 0);
        return `
        <tr>
          <td>${escapeHtml(p.id)}</td>
          <td>${escapeHtml(p.name)} (${escapeHtml(p.username || '@player')})</td>
          <td><b>Br ${escapeHtml(bal.toFixed(2))}</b></td>
          <td><span class="badge ${p.status==='active'?'approved':'pending'}">${escapeHtml(p.status || 'active')}</span></td>
          <td>
            <div class="row-gap">
              <button class="btn btn-green" type="button" onclick="setPlayerStatus('${escapeHtml(p.id)}','active')">Active</button>
              <button class="btn btn-yellow" type="button" onclick="setPlayerStatus('${escapeHtml(p.id)}','frozen')">Freeze</button>
              <button class="btn btn-red" type="button" onclick="setPlayerStatus('${escapeHtml(p.id)}','banned')">Ban</button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    async function setPlayerStatus(id, st) {
      try {
        await fetch('/api/studio/player-status', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ userId: id, status: st })
        });
      } catch (e) {}
      const p = EXT.players.find(x => x.id === id);
      if (p) p.status = st;
      EXT.audit.unshift({ user: id, action: 'STATUS_' + st.toUpperCase(), amount: '-', reason: 'Updated by Admin' });
      saveState();
      renderAudit();
      toast('Player updated: ' + st);
      loadAll();
    }

    async function setGameState(phase, msg) {
      const actionMap = { RUNNING: 'play_now', PAUSED: 'pause', CANCELLED: 'pause', LOBBY: 'start' };
      try {
        await fetch('/api/studio/game-control', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ action: actionMap[phase] || 'start', stake: liveCache.stake || 10 })
        });
      } catch (e) {}
      liveCache.phase = phase;
      applyLiveToDom();
      notifyAction(msg);
      loadAll();
    }

    function renderWinners() {
      const tbody = document.getElementById('winnersTbody');
      if (!tbody) return;
      tbody.innerHTML = EXT.winners.map(w => `
        <tr>
          <td>${escapeHtml(w.game)}</td>
          <td>${escapeHtml(w.player)}</td>
          <td>${escapeHtml(w.board)} · ${escapeHtml(w.pattern)}</td>
          <td><b>Br ${escapeHtml(w.prize)}</b></td>
          <td>${w.paid ? '<span class="badge approved">PAID</span>' : `<button class="btn btn-green" type="button" onclick="approveWinner('${escapeHtml(w.id)}')">Approve Prize</button>`}</td>
        </tr>`).join('');
    }

    function approveWinner(id) {
      const w = EXT.winners.find(x => x.id === id);
      if (!w) return;
      w.paid = true;
      EXT.audit.unshift({ user: w.player, action: 'PRIZE_PAID', amount: 'Br ' + w.prize, reason: 'Verified winner ' + w.id });
      saveState();
      renderWinners();
      renderAudit();
      toast('Prize approved');
    }

    function renderAudit() {
      const tbody = document.getElementById('auditTbody');
      if (!tbody) return;
      tbody.innerHTML = EXT.audit.map(a => `
        <tr><td>${escapeHtml(a.user)}</td><td>${escapeHtml(a.action)}</td><td>${escapeHtml(a.amount)}</td><td>${escapeHtml(a.reason)}</td></tr>`).join('');
    }

    function sendBroadcast() {
      const msg = (document.getElementById('bcMessage').value || '').trim();
      const target = document.getElementById('bcTarget').value;
      const type = document.getElementById('bcType').value;
      if (!msg) return toast('መልእክት ያስገቡ');
      document.getElementById('bcMessage').value = '';
      notifyAction(`${type} -> ${target}: ${msg}`);
    }

    function exportCsv() {
      const csv = 'Section,Value\nRegistered Users,' + (liveCache.usersCount ?? 0) + '\nBooked Boards,' + (liveCache.takenBoardsCount ?? 0) + '\nToday Deposits,14850\nToday Withdrawals,6200';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = 'zina-bingo-report.csv';
      a.click();
      toast('CSV ወርዷል');
    }

    function renderTickets() {
      const box = document.getElementById('ticketsBox');
      if (!box) return;
      box.innerHTML = EXT.tickets.map(t => `
        <div class="req-item">
          <b>${escapeHtml(t.id)} · ${escapeHtml(t.player)}</b> — <span class="badge ${t.status==='open'?'pending':'approved'}">${escapeHtml(t.status)}</span>
          <div style="margin:6px 0;font-size:13px;">${escapeHtml(t.text)}</div>
          ${t.status==='open' ? `<button class="btn btn-green" type="button" onclick="closeTicket('${escapeHtml(t.id)}')">Close Ticket</button>` : ''}
        </div>`).join('');
    }

    function closeTicket(id) {
      const t = EXT.tickets.find(x => x.id === id);
      if (!t) return;
      t.status = 'closed';
      saveState();
      renderTickets();
      toast('Ticket closed');
    }

    function toggleBotStatus(on) {
      EXT.botOnline = on;
      applyLiveToDom();
      saveState();
      notifyAction('Bot status: ' + (on ? 'ONLINE' : 'OFFLINE'));
    }

    function createBackup() {
      EXT.backups.unshift({ id: 'BKP-' + String(Date.now()).slice(-5), note: 'Safe backup — all balances & history intact' });
      saveState();
      renderBackups();
      toast('Backup created');
    }

    function renderBackups() {
      const box = document.getElementById('backupList');
      if (!box) return;
      box.innerHTML = EXT.backups.map(b =>
        `<div class="req-item"><b>${escapeHtml(b.id)}</b> — <span class="label" style="display:inline;">${escapeHtml(b.note)}</span></div>`
      ).join('');
    }

    async function saveSettings() {
      const body = {
        telebirr: document.getElementById('cfgTelebirr').value,
        cbe: document.getElementById('cfgCbe').value,
        welcomeBonus: Number(document.getElementById('cfgBonus').value),
        minDeposit: Number(document.getElementById('cfgMinDep').value),
        minWithdraw: Number(document.getElementById('cfgMinWdr').value)
      };
      const r = await fetch('/api/studio/settings', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify(body)
      });
      if (r.ok) {
        EXT.audit.unshift({ user: 'Admin', action: 'SETTINGS', amount: '-', reason: 'Updated payment & game settings' });
        saveState();
        renderAudit();
        alert('✅ ቅንብሮች ተቀምጠዋል!');
        loadAll();
      }
    }

    async function adjustBalance() {
      const userId = document.getElementById('balUserId').value.trim();
      const delta = Number(document.getElementById('balDelta').value);
      const reason = (document.getElementById('balReason')?.value || 'Admin balance adjustment').trim();
      const r = await fetch('/api/studio/balance', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({ userId, delta })
      });
      const d = await r.json();
      if (r.ok) {
        EXT.audit.unshift({ user: userId, action: 'BALANCE_ADJ', amount: (delta >= 0 ? '+' : '') + delta + ' ብር', reason });
        saveState();
        renderAudit();
        alert('✅ ሂሳብ ተዘምኗል! አዲስ Main Balance: ' + d.user.main + ' ብር');
        document.getElementById('balUserId').value = '';
        document.getElementById('balDelta').value = '';
        if (document.getElementById('balReason')) document.getElementById('balReason').value = '';
        loadAll();
      } else {
        alert('❌ ' + (d.error || 'ስህተት'));
      }
    }

    async function decideReq(id, action) {
      const reqObj = (liveCache.requests || []).find(r => r.id === id);
      const r = await fetch('/api/studio/requests/' + encodeURIComponent(id) + '/' + action, {
        method: 'POST',
        headers: headers()
      });
      const d = await r.json();
      if (r.ok) {
        const uLabel = reqObj ? reqObj.userId : id;
        const amtLabel = reqObj ? (reqObj.amount + ' ብር') : '-';
        EXT.audit.unshift({ user: uLabel, action: 'REQ_' + action.toUpperCase(), amount: amtLabel, reason: 'Processed request ' + id });
        saveState();
        renderAudit();
        loadAll();
      } else {
        alert('❌ ' + (d.error || 'ስህተት'));
      }
    }

    renderLayout();
    loadAll();
    setInterval(loadAll, 4000);
  </script>
</body>
</html>
